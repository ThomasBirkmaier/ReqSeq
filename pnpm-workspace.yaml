packages:
  - "packages/*"
# A package version published less than a day ago fails the install (ADR-0015, #938). Set explicitly, although it is
# pnpm's default since pnpm 11, so that a change of the default cannot lower it.
minimumReleaseAge: 1440
overrides:
  mermaid>katex: 0.19.0
  # GHSA-g3hv-75wg-m249 (DoS via globparts amplification) is fixed only in minimatch 11; eslint and typescript-eslint still ask for ^10. Dev-only.
  minimatch@^10: ^11.0.3
