# Relation limits (SR-152): a system requirement derives from at most one use case and from at
# least one need; based-on has no limit.
reqseq-metamodel: 1

types:
  - { key: need, name: Need, prefix: N, meaning: need, properties: [title], required: [title] }
  - { key: use-case, name: Use Case, prefix: UC, properties: [title], required: [title] }
  - key: system-requirement
    name: System Requirement
    prefix: SR
    meaning: requirement
    properties: [title]
    required: [title]
  - { key: decision, name: Decision, prefix: D, properties: [title] }

properties:
  - { key: title, name: Title, kind: text, meaning: title }

relations:
  - key: derives-from
    name: Derives from
    inverse-name: Derived by
    source-types: [system-requirement]
    target-types: [need, use-case]
    meaning: derivation
    limits:
      - { target-type: use-case, max: 1 }
      - { source-type: system-requirement, target-type: need, min: 1 }
  - key: based-on
    name: Based on
    inverse-name: Basis for
    target-types: [decision]

statuses:
  - { key: draft, name: Draft, initial: true }
  - { key: rejected, name: Rejected, invalid: true }
