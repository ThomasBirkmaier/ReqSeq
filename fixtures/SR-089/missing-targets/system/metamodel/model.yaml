# Missing targets (SR-089): relation kinds and relation-valued properties, one of them a list.
reqseq-metamodel: 1

types:
  - { key: need, name: Need, prefix: N, properties: [title] }
  - key: system-requirement
    name: System Requirement
    prefix: SR
    properties: [title, parent-item, see-also]
  - { key: decision, name: Decision, prefix: D, properties: [title] }

properties:
  - { key: title, name: Title, kind: text, meaning: title }
  - { key: parent-item, name: Parent item, kind: relation }
  - { key: see-also, name: See also, kind: relation, many: true }

relations:
  - { key: derives-from, name: Derives from, inverse-name: Derived by }
  - { key: based-on, name: Based on, inverse-name: Basis for }

statuses:
  - { key: draft, name: Draft, initial: true }
