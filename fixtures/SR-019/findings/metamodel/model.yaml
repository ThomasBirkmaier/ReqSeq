# One finding of each kind that workspace.check reports in stage 1 (SR-019 AK2).
reqseq-metamodel: 1

types:
  - { key: need, name: Need, prefix: N, meaning: need, properties: [title, priority], required: [title] }
  - key: system-requirement
    name: System Requirement
    prefix: SR
    meaning: requirement
    properties: [title, weight, verification-method, validity]
    required: [title, verification-method]
  - { key: variant, name: Variant, prefix: VAR, meaning: variant, properties: [title], required: [title] }

properties:
  - { key: title, name: Title, kind: text, meaning: title }
  - { key: weight, name: Weight, kind: number }
  - key: priority
    name: Priority
    kind: choice
    choices:
      - { key: low, name: Low }
      - { key: high, name: High }
  - { key: validity, name: Validity, kind: relation, many: true, target-types: [variant], meaning: validity }
  - key: verification-method
    name: Verification Method
    kind: choice
    choices:
      - { key: test, name: Test }
      - { key: inspection, name: Inspection }

relations:
  - key: derives-from
    name: Derives from
    inverse-name: Derived by
    source-types: [system-requirement]
    target-types: [need]
    meaning: derivation

statuses:
  - { key: draft, name: Draft, initial: true }
  - { key: approved, name: Approved }
  - { key: obsolete, name: Obsolete, invalid: true }
