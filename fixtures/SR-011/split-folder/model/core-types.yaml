# Types of the weather station; the other lists are in their own files.
logreq-metamodel: 1
types:
  - key: need
    name: Need
    prefix: N
    meaning: need
    properties: [title]
    required: [title]
  - key: system-requirement
    name: System Requirement
    prefix: SR
    meaning: requirement
    properties: [title, wind-class]
    required: [title]
