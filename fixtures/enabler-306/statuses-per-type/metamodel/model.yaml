# Statuses per type (#306): the top-level statuses are the vocabulary; a type restricts them with
# `statuses`, inherited like properties. Needs have every status, glossary terms have none.
logreq-metamodel: 1

types:
  - key: need
    name: Need
    prefix: N
    meaning: need
    properties: [title]
  - key: requirement
    name: Requirement
    prefix: SR
    meaning: requirement
    properties: [title]
    statuses: [draft, obsolete]
  - key: safety-requirement
    name: Safety Requirement
    prefix: SSR
    extends: requirement
    statuses: [approved]
  - key: decision
    name: Decision
    prefix: D
    properties: [title]
    statuses: [accepted, superseded]
  - key: term
    name: Glossary Term
    prefix: T
    properties: [title]
    statuses: []

properties:
  - key: title
    name: Title
    kind: text
    meaning: title

relations:
  - key: derives-from
    name: Derives from
    meaning: derivation
  - key: supersedes
    name: Supersedes
    meaning: replacement

statuses:
  - { key: draft, name: Draft, initial: true }
  - { key: approved, name: Approved }
  - { key: accepted, name: Accepted }
  - { key: obsolete, name: Obsolete, invalid: true }
  - { key: superseded, name: Superseded, invalid: true }
