# Value kinds (SR-085): one property per kind, lists, and a relation kind.
logreq-metamodel: 1

types:
  - { key: need, name: Need, prefix: N, meaning: need, properties: [title], required: [title] }
  - key: system-requirement
    name: System Requirement
    prefix: SR
    meaning: requirement
    properties:
      [title, weight, due, priority, parent-item, acceptance-criteria, review-dates, platforms, legacy-class]
    required: [title]

properties:
  - { key: title, name: Title, kind: text, meaning: title }
  - { key: weight, name: Weight, kind: number, content: true }
  - { key: due, name: Due date, kind: date }
  - key: priority
    name: Priority
    kind: choice
    choices:
      - { key: low, name: Low }
      - { key: medium, name: Medium }
      - { key: high, name: High }
  - { key: parent-item, name: Parent item, kind: relation, target-types: [need] }
  - { key: acceptance-criteria, name: Acceptance Criteria, kind: text, many: true, content: true }
  - { key: review-dates, name: Review dates, kind: date, many: true }
  - key: platforms
    name: Platforms
    kind: choice
    many: true
    choices:
      - { key: linux, name: Linux }
      - { key: windows, name: Windows }
  - { key: legacy-class, name: Legacy class, kind: choice }

relations:
  - key: derives-from
    name: Derives from
    inverse-name: Derived by
    source-types: [system-requirement]
    target-types: [need, system-requirement]
    meaning: derivation

statuses:
  - { key: draft, name: Draft, initial: true }
