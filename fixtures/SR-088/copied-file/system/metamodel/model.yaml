# Duplicate IDs (SR-088): a need, a system requirement and a relation between them.
reqseq-metamodel: 1

types:
  - { key: need, name: Need, prefix: N, meaning: need, properties: [title], required: [title] }
  - key: system-requirement
    name: System Requirement
    prefix: SR
    meaning: requirement
    properties: [title]
    required: [title]

properties:
  - { key: title, name: Title, kind: text, meaning: title }

relations:
  - key: derives-from
    name: Derives from
    inverse-name: Derived by
    source-types: [system-requirement]
    target-types: [need]
    meaning: derivation

statuses:
  - { key: draft, name: Draft, initial: true }
