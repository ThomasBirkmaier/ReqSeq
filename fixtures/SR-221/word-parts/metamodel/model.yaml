# SR-221: word parts. "seite" stands inside the type name "Hilfeseite" and the status name
# "Unterseite"; "Blatt" has the synonym "Seite" (SR-220), whose other designations are whole words.
reqseq-metamodel: 1
types:
  - key: help-page
    name: Hilfeseite
    prefix: HS
    properties: [title]
    required: [title]
  - key: system-requirement
    name: System Requirement
    prefix: SR
    meaning: requirement
    properties: [title, notes, synonyms]
    required: [title]
properties:
  - { key: title, name: Title, kind: text, meaning: title }
  - { key: notes, name: Notes, kind: text }
  - { key: synonyms, name: Synonyms, kind: text, many: true, meaning: synonyms }
relations:
  - { key: derives-from, name: Derives from, inverse-name: Derived by, meaning: derivation }
  - { key: supersedes, name: Supersedes, inverse-name: Superseded by, meaning: succession }
statuses:
  - { key: draft, name: Draft, initial: true }
  - { key: subpage, name: Unterseite }
