# Metamodel for SR-015: the tests edit this file and check that no element file changes.
reqseq-metamodel: 1

types:
  - { key: need, name: Need, prefix: N, meaning: need, properties: [title], required: [title] }
  - key: system-requirement
    name: System Requirement
    prefix: SR
    meaning: requirement
    properties: [title, verification-method, priority]
    required: [title]
  - key: safety-requirement
    name: Safety Requirement
    prefix: SAF
    extends: system-requirement

properties:
  - { key: title, name: Title, kind: text, meaning: title }
  - key: verification-method
    name: Verification Method
    kind: choice
    content: true
    choices:
      - { key: test, name: Test }
      - { key: inspection, name: Inspection }
  - key: priority
    name: Priority
    kind: choice
    choices:
      - { key: low, name: Low }
      - { key: high, name: High }

relations:
  - key: derives-from
    name: Derives from
    inverse-name: Derived by
    source-types: [system-requirement]
    target-types: [need, system-requirement]
    meaning: derivation

statuses:
  - { key: draft, name: Draft, initial: true }
