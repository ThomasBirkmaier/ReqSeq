# The example of SR-043 (rationale), cut down to K1, K2, A1, A2 and variant A, with text and acceptance
# criteria for K1 and its replacement A1 (SR-044 AK2), which the example of SR-043 does not have: variant A
# replaces K1 by A1 (validity [A]), excludes K2 and adds A2 (validity [A]).
reqseq-metamodel: 1
types:
  - { key: need, name: Need, prefix: N, meaning: need, properties: [title] }
  - {
      key: system-requirement,
      name: System Requirement,
      prefix: SR,
      meaning: requirement,
      properties: [title, acceptance-criteria, validity],
    }
  - { key: decision, name: Decision, prefix: D, properties: [title] }
  - { key: variant, name: Variant, prefix: VAR, meaning: variant, properties: [title] }
  - { key: package, name: Package, prefix: PKG, meaning: package, properties: [title] }
properties:
  - { key: title, name: Title, kind: text, meaning: title }
  - {
      key: acceptance-criteria,
      name: Acceptance Criteria,
      kind: text,
      many: true,
      content: true,
      markdown: true,
    }
  - { key: validity, name: Validity, kind: relation, many: true, target-types: [variant], meaning: validity }
relations:
  - { key: derives-from, name: Derives from, inverse-name: Derived by, meaning: derivation }
  - {
      key: replaces,
      name: Replaces,
      inverse-name: Replaced by,
      source-types: [system-requirement],
      target-types: [system-requirement],
      meaning: replacement,
    }
  - {
      key: excludes,
      name: Excludes,
      inverse-name: Excluded by,
      source-types: [variant],
      target-types: [system-requirement],
      meaning: exclusion,
    }
statuses:
  - { key: draft, name: Draft, initial: true }
  - { key: obsolete, name: Obsolete, invalid: true }
