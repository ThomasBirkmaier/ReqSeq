name: Documentation site
description: >-
  Builds the user documentation site (ADR-0017) after `pnpm install` and `pnpm build`: the content generated, the
  site installed, audited and built without network (unshare -rn) into packages/docs/site/dist. Shared by
  docs-pages.yml (GitHub Pages) and release.yml (job docs-site, the offline build that every delivery ships, SR-141).
  Linux only.
inputs:
  offline:
    description: "`true` for the build a delivery ships: base `/`, no repository link (REQSEQ_DOCS_OFFLINE=1)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # unshare below needs unprivileged user namespaces, which AppArmor blocks on Ubuntu 24.04.
    - name: User namespaces for unshare
      shell: bash
      run: |
        if ! unshare -r true 2>/dev/null; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    # The app's screenshots and the README animation are frozen while the Electron app is paused (#2295): the site
    # takes the committed copies in docs/guide/images/ as they are, and they may show an older state of the app.
    # The audit sees only the site's lockfile; `pnpm audit --prod` and `licenses:check` of the workspace do not.
    # The page "What's new" needs the release tags (#1259): the callers check out the whole history, and
    # REQSEQ_DOCS_RELEASES=1 stops a build in a shallow clone or without a release tag.
    - name: Generate, install and audit the site
      shell: bash
      env:
        REQSEQ_DOCS_OFFLINE: ${{ inputs.offline == 'true' && '1' || '' }}
        REQSEQ_DOCS_RELEASES: "1"
      run: |
        pnpm docs:generate
        pnpm docs:install
        pnpm audit --dir packages/docs/site --ignore-workspace --audit-level high
    - name: Build the site without network (unshare -rn)
      shell: bash
      env:
        REQSEQ_DOCS_OFFLINE: ${{ inputs.offline == 'true' && '1' || '' }}
      run: unshare -rn node packages/docs/site/run.mjs build
