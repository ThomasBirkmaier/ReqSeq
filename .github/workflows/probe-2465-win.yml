# Fast loop for #2465 (Windows recorders): the shell's e2e suite on Windows only, with the CI recorder setup. Never
# merged: it lives only on the branch probe/2465-win-e2e.
name: Probe 2465 Windows e2e

on:
  push:
    branches: [probe/2465-win-e2e]

permissions:
  contents: read

jobs:
  e2e:
    name: shell e2e (windows-2025)
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Rust toolchain
        working-directory: packages/shell
        shell: bash
        run: |
          rustup toolchain install
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: shell-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/shell/Cargo.lock', 'packages/shell/rust-toolchain.toml') }}-llvm-cov-0.9.1-audit-0.22.2
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shell/target
          key: shell-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/shell/Cargo.lock', 'packages/shell/Cargo.toml', 'packages/shell/*/Cargo.toml', 'packages/shell/rust-toolchain.toml') }}-llvm-cov-0.9.1
          restore-keys: shell-target-v1-${{ runner.os }}-${{ runner.arch }}-
      - working-directory: packages/shell
        run: cargo fetch --locked
      - run: pnpm --filter @reqseq/shell build:e2e
      - name: Shell - recorders (Windows)
        shell: pwsh
        run: |
          auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:enable
          if ($LASTEXITCODE -ne 0) { exit 1 }
          auditpol /set /subcategory:"{0CCE9226-69AE-11D9-BED3-505054503030}" /failure:enable
          if ($LASTEXITCODE -ne 0) { exit 1 }
          reg add HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System\Audit /v ProcessCreationIncludeCmdLine_Enabled /t REG_DWORD /d 1 /f
          if ($LASTEXITCODE -ne 0) { exit 1 }
          wevtutil sl Microsoft-Windows-DNS-Client/Operational /e:true
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-NetFirewallProfile -All -Enabled True
          Get-NetFirewallProfile | Format-Table Name, Enabled, DefaultOutboundAction -AutoSize
          Add-Content -Path $env:GITHUB_ENV -Value 'REQSEQ_SHELL_E2E_RECORD=windows'
      - name: Shell - e2e
        timeout-minutes: 12
        run: pnpm --filter @reqseq/shell exec vitest run --config vitest.shell.config.ts --reporter=verbose -t "Windows"
