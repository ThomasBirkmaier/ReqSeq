name: Issue working

# Puts `agent:working` on every open issue a pull request closes (`Closes #N`, GitHub's closing
# keywords) when the PR is opened, reopened or its text is edited, so the board shows the issue
# "In Progress" even when the agent forgot the label; removes the label when the PR merges.
# Runs no repository code: the PR text is read from the event, never executed.
# Writes with PROJECT_TOKEN when it is set, because a label set with the workflow token starts no
# `project-sync` run; without it the nightly sync catches up.

on:
  pull_request_target:
    types: [opened, reopened, edited, closed]

permissions:
  issues: write

jobs:
  label:
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set or remove agent:working
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || github.token }}
          ACTION: ${{ github.event.action }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          numbers=$(printf '%s' "$BODY" \
            | grep -oiE '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un || true)
          for n in $numbers; do
            info=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq '[.state, (.pull_request != null)] | @tsv') || continue
            state=${info%%$'\t'*}
            is_pr=${info##*$'\t'}
            [ "$is_pr" = "false" ] || continue
            if [ "$ACTION" = "closed" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$n/labels/agent:working" --silent || true
            elif [ "$state" = "open" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$n/labels" -f "labels[]=agent:working" --silent
            fi
          done
