name: Issue working

# Puts `agent:working` on every open issue a pull request closes (`Closes #N`, GitHub's closing
# keywords) when the PR is opened, reopened or its text is edited, so the board shows the issue
# "In Progress" even when the agent forgot the label; removes the label when the PR is closed,
# merged or not.
# Runs no repository code: the PR text is read from the event, never executed.
# Writes with the workflow token: with PROJECT_TOKEN the label writes after #1056 got HTTP 403
# "Must have admin rights to Repository". A label set with the workflow token starts no
# `project-sync` run, so the job starts `project-sync` itself after a change.

on:
  pull_request_target:
    types: [opened, reopened, edited, closed]

permissions:
  issues: write
  actions: write

jobs:
  label:
    # Only PRs from branches of this repository: a fork PR must not make the workflow write labels.
    # Only PRs into the default branch, because only their merge closes the issue.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set or remove agent:working
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BODY: ${{ github.event.pull_request.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          numbers=$(printf '%s' "$BODY" \
            | grep -oiE '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un || true)
          failed=0
          changed=0
          for n in $numbers; do
            info=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" \
              --jq '[.state, (.pull_request != null), any(.labels[]; .name == "agent:working")] | @tsv') \
              || { echo "::error::could not read #$n"; failed=1; continue; }
            IFS=$'\t' read -r state is_pr labelled <<< "$info"
            [ "$is_pr" = "false" ] || continue
            if [ "$ACTION" = "closed" ]; then
              [ "$labelled" = "true" ] || continue
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$n/labels/agent:working" --silent \
                && changed=1 || { echo "::error::could not remove agent:working from #$n"; failed=1; }
            elif [ "$state" = "open" ] && [ "$labelled" = "false" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$n/labels" -f "labels[]=agent:working" --silent \
                && changed=1 || { echo "::error::could not label #$n"; failed=1; }
            fi
          done
          if [ "$changed" = 1 ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/project-sync.yml/dispatches" \
              -f "ref=$DEFAULT_BRANCH" --silent || { echo "::error::could not start project-sync"; failed=1; }
          fi
          exit "$failed"
