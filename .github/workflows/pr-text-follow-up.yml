name: PR text follow-up

# Re-runs the required job `static` of a pull request's CI run when it failed only in its Trace check step and a
# `trace-check (PR text)` (pr-text.yml) passed on a PR text read after `static` read it: a label `enabler` or a PR text
# fixed after that step (#372, #566). GitHub re-runs a job only once its whole run has completed, so this workflow
# starts when CI or PR text completes, and whichever of the two completes last finds both done. Until #739 the PR-text
# job waited for the CI run itself and held a runner slot for the whole run.
# Security: `workflow_run` runs the default branch's version of this file with a write token (`actions: write`), so it
# checks out nothing and runs no code of the pull request; it reads the pull request, the runs and their jobs through
# the API only, and passes no event text through an expression into the script.

on:
  workflow_run:
    workflows: [CI, PR text]
    types: [completed]

permissions: {}

concurrency:
  # One follow-up per head commit; a newer one cancels an older one, because it reads the state afresh. Only the runs
  # that can re-run share the group, so that the many skipped label runs never cancel one (#566). The group is not a CI
  # group, so it never cancels a CI run.
  group: pr-text-follow-up-${{ github.event.workflow_run.head_sha }}-${{ ((github.event.workflow_run.name == 'CI' && github.event.workflow_run.conclusion == 'failure') || (github.event.workflow_run.name == 'PR text' && github.event.workflow_run.conclusion == 'success')) && 'check' || github.run_id }}
  cancel-in-progress: true

jobs:
  rerun-static:
    name: re-run static
    # A failed CI run (its `static` may have failed in Trace check) or a passed PR-text check, of a pull request of
    # this repository: a fork's pull request is left alone, as before #739.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.name == 'CI' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event.workflow_run.name == 'PR text' && github.event.workflow_run.conclusion == 'success'))
    permissions:
      actions: write # Re-run static
      pull-requests: read # The pull request of the head commit
    runs-on: ubuntu-24.04
    # A few API calls; it never waits for another run.
    timeout-minutes: 5
    steps:
      - name: Re-run static
        uses: actions/github-script@v7
        with:
          # A single 502 of the API ended the whole job (#480); octokit retries 5xx answers.
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const trigger = context.payload.workflow_run;
            const headSha = trigger.head_sha;
            const newestFirst = (runs) => [...runs].sort((a, b) => b.run_number - a.run_number);
            const jobsOf = (run) =>
              github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, filter: "latest", per_page: 100,
              });

            // The open pull request whose head is this commit.
            let number = trigger.pull_requests.find((p) => p.head.sha === headSha)?.number;
            if (number === undefined) {
              const { data } = await github.rest.pulls.list({
                owner, repo, state: "open", head: `${owner}:${trigger.head_branch}`, per_page: 10,
              });
              number = data.find((p) => p.head.sha === headSha)?.number;
            }
            if (number === undefined) return core.info("No open pull request with this head commit");
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            // A push makes a new CI run that reads the PR text itself, so the old run is never re-run: its re-run
            // would join the pull request's CI group and cancel the new run.
            if (pr.state !== "open" || pr.head.sha !== headSha) return core.info("The head commit changed; its own run checks");
            if (pr.user.login === "dependabot[bot]") return core.info("Dependabot pull request");

            // The newest CI run of the head commit is the one GitHub reads the required checks from.
            const { data: ci } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "ci.yml", event: "pull_request", head_sha: headSha, per_page: 20,
            });
            const run = newestFirst(ci.workflow_runs)[0];
            if (!run) return core.info("No CI run of the head commit");
            if (run.status !== "completed") return core.info(`CI run ${run.html_url} still runs; its completion starts this workflow again`);
            const job = (await jobsOf(run)).find((j) => j.name === "static");
            if (!job || job.conclusion !== "failure") return core.info(`static: ${job?.conclusion ?? job?.status ?? "missing"}`);
            const failed = job.steps.filter((step) => step.conclusion === "failure").map((step) => step.name);
            if (failed.length === 0 || failed.some((name) => name !== "Trace check")) {
              return core.info(`static failed in ${failed.join(", ") || "no step"}, not only in Trace check`);
            }
            const staticRead = job.steps.find((step) => step.name === "Write PR body")?.started_at;
            if (!staticRead) return core.info("static did not read the PR text");

            // The newest PR-text check of the head commit that was not skipped (other labels skip it).
            const { data: texts } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "pr-text.yml", event: "pull_request", head_sha: headSha, per_page: 30,
            });
            let check;
            for (const textRun of newestFirst(texts.workflow_runs)) {
              check = (await jobsOf(textRun)).find((j) => j.name === "trace-check (PR text)" && j.conclusion !== "skipped");
              if (check) break;
            }
            if (!check) return core.info("No trace-check (PR text) of the head commit");
            if (check.status !== "completed") return core.info(`${check.html_url} still runs; its completion starts this workflow again`);
            if (check.conclusion !== "success") return core.info(`trace-check (PR text): ${check.conclusion}`);
            // Only a text read after static read it explains static's failure. This also ends the chain: the re-run
            // of static reads the text after the check did, so a failed re-run is never re-run again.
            const checkRead = check.steps.find((step) => step.name === "Write PR body")?.started_at;
            if (!checkRead || Date.parse(checkRead) <= Date.parse(staticRead)) {
              return core.info("trace-check (PR text) read the PR text before static did");
            }
            await github.rest.actions.reRunJobForWorkflowRun({ owner, repo, job_id: job.id });
            core.info(`Re-running ${job.html_url}`);
