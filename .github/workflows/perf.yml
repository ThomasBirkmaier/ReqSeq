name: Performance

# ADR-0011, #126: the performance suite on the generated workspace with 50,000 elements and 200,000
# relations (packages/testkit, D-055; tests in packages/*/test/perf/). Nightly and on pull requests
# labelled `perf` (once, when the label is added: a later push does not run it again, so a pull request does not
# hold a runner for every push, product owner decision 2026-10-28; to measure again, remove the label and add it
# again); it is not a required check. Every time goes into the record
# verification/performance.md, and a time over its threshold opens or updates an issue labelled `perf`.
# A test tagged `[SR-xxx/AKn]` asserts its threshold and fails the run (ADR-0011: a pass on a runner at
# or below the reference machine of 4 cores and 16 GB is evidence); untagged measurements only record. Failing
# correctness assertions (wrong counts, findings, versions) fail it too. On Linux the suite runs inside
# `unshare -rn`, without network, like the CLI e2e suite (ci.yml).
#
# Two jobs: `perf` runs the suite read-only (also for pull requests); `record` runs only on the
# schedule or a manual run, with write rights, and commits the record and files the issue. The record goes to the
# branch `perf-record`, not to main: the main ruleset requires checks and has no bypass, and a pull request opened
# with GITHUB_TOKEN starts no workflows, so it could never get them (#340).

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, closed]

permissions:
  contents: read

concurrency:
  # Adding a label other than `perf` gets a group of its own, so that it never cancels a running suite. Closing or
  # merging the pull request joins the suite's group and cancels it; that run starts no job (product owner decision,
  # 2026-10-28). Keyed on the pull request's number, because the `closed` run of a merged pull request may carry the
  # base branch as its ref.
  group: perf-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'perf' && github.run_id || 'suite' }}
  cancel-in-progress: true

jobs:
  # A pull request labelled `perf` that changes only files no test or build reads skips the suite (#520,
  # .github/scripts/tests-needed.sh, as in ci.yml); `perf` then shows as skipped. Nightly and manual runs skip
  # this job and run the suite.
  changes:
    name: changed files
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'perf') && github.event.action != 'closed' &&
      (github.event.action != 'labeled' || github.event.label.name == 'perf')
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its parents: the first parent is the base branch it was merged into.
          fetch-depth: 2
          persist-credentials: false
      - name: Changed files
        id: changes
        run: |
          files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          tests="$(bash <(git show HEAD^1:.github/scripts/tests-needed.sh) <<< "$files")" # the base branch's copy (#566)
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Performance suite needed: \`$tests\`" >> "$GITHUB_STEP_SUMMARY"

  perf:
    name: perf (ubuntu-24.04)
    needs: changes
    # On pull requests only with label `perf`; adding another label does not restart the run. If `changes` fails,
    # its output is empty and the suite runs.
    if: >-
      !cancelled() && needs.changes.outputs.tests != 'false' &&
      (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'perf') && github.event.action != 'closed' &&
      (github.event.action != 'labeled' || github.event.label.name == 'perf')))
    # GitHub's hosted Ubuntu runner for public repositories has 4 cores and 16 GB, the reference machine
    # (ADR-0011); the job prints what it got.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      exceeded: ${{ steps.report.outputs.exceeded }}
      complete: ${{ steps.report.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Performance suite without network (unshare -rn)
        run: |
          # As in ci.yml (CLI e2e): Ubuntu 24.04 lets AppArmor block unprivileged user namespaces; allow
          # them for this job only. If unshare still fails, the step fails: never a run with network.
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "Runner: $(nproc) cores, $(free -g | awk '/^Mem:/ {print $2}') GB memory"
          # `pnpm test:perf` without pnpm inside the namespace: remove old results, then run Vitest.
          # Keep in step with the `test:perf` script in package.json.
          rm -f test-results/perf.jsonl test-results/junit-perf.xml
          unshare -rn sh -c 'ip link set lo up && exec ./node_modules/.bin/vitest run --config vitest.perf.config.ts'
      - name: Report
        id: report
        if: always() && hashFiles('test-results/perf.jsonl') != ''
        run: >-
          node scripts/perf/report.mjs --results test-results/perf.jsonl --out verification/performance.md
          --commit "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT" --junit test-results/junit-perf.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            test-results/
            verification/performance.md
          if-no-files-found: ignore

  record:
    name: record and report
    needs: perf
    if: always() && needs.perf.result != 'skipped' && github.event_name != 'pull_request' && needs.perf.outputs.exceeded != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the nightly run commits verification/performance.md to the branch perf-record
      issues: write # an exceeded threshold opens or updates an issue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: perf-results
          path: perf-results
      - name: Commit the record (nightly, to the branch perf-record)
        # Only a complete record is kept (#202): the suite ran and its only failures, if any, are
        # threshold assertions of tagged tests, which fail after their time was recorded. A crash, a
        # failed correctness assertion or a skipped test may leave rows out, so its record stays out.
        # The branch starts from main the first time and then only gains record commits (#340).
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.perf.outputs.complete == 'true'
        run: |
          # Exit code 2: the branch does not exist yet. Any other failure fails the step, so a network error never
          # rebuilds the branch from main.
          if git ls-remote --exit-code --heads origin perf-record > /dev/null; then
            git fetch --depth=1 origin perf-record
            git checkout -B perf-record FETCH_HEAD
          elif [ $? -eq 2 ]; then
            git checkout -B perf-record
          else
            exit 1
          fi
          cp perf-results/verification/performance.md verification/performance.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/performance.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(perf): nightly performance record for ${GITHUB_SHA} [skip ci]" -m "Refs #126"
          git push origin HEAD:perf-record
      - name: Open or update the issue for exceeded thresholds
        # Runs from other branches stay out of the issue. `always()`: a failed commit of the record does not hide it. `actions/github-script`, not `gh`, so the step needs no
        # GitHub CLI on the runner.
        if: always() && needs.perf.outputs.exceeded != '0' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          EXCEEDED: ${{ needs.perf.outputs.exceeded }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("node:fs");
            const record = fs.readFileSync("perf-results/verification/performance.md", "utf8");
            const lines = record.split("\n");
            const exceeded = lines.filter((line) => line.includes("| **exceeded** |"));
            // The names of the exceeded measurements; a comment is added only when they change.
            const names = exceeded
              .map((line) => line.split("|")[1].trim())
              .sort()
              .join(";");
            const marker = `<!-- perf-exceeded: ${names} -->`;
            const { owner, repo } = context.repo;
            // Only the exceeded rows: the whole record is longer than an issue body may be (65,536 characters).
            const machine = lines.find((line) => line.startsWith("- Machine:")) ?? "- Machine: not in the record";
            const header = "| Measurement | Basis | Time | Threshold | Result |";
            const full = [
              marker,
              `${process.env.EXCEEDED} threshold(s) exceeded in ${process.env.RUN_URL} (${context.eventName}, commit ${context.sha}).`,
              "",
              machine,
              `- Whole record: the artifact \`perf-results\` of ${process.env.RUN_URL} and ${context.serverUrl}/${owner}/${repo}/blob/perf-record/verification/performance.md`,
              "",
              "If the runner has fewer than 4 cores or 16 GB, measure again on such a machine before changing code (ADR-0011).",
              "",
              header,
              "|---|---|---|---|---|",
              ...exceeded,
              "",
              "---",
              "_Written by the performance workflow_",
            ].join("\n");
            // Guard: an issue body or comment holds at most 65,536 characters.
            const LIMIT = 65_000;
            const note = "\n\n(truncated, see the record)";
            const body = full.length > LIMIT ? full.slice(0, LIMIT - note.length) + note : full;
            // The open issue of this workflow (label `perf` and its title) is the one to update, never a second
            // one; other issues labelled `perf` track single findings (#558, #698) and get no comments.
            const title = "perf: thresholds exceeded with 50,000 elements";
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "perf", sort: "created", direction: "asc", per_page: 100,
            });
            const issue = open.find((i) => i.pull_request === undefined && i.title === title);
            if (issue === undefined) {
              await github.rest.issues.create({ owner, repo, title, body, labels: ["perf"] });
              core.info("opened an issue");
              return;
            }
            // All pages: the latest marker may be past the first 100 comments.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100,
            });
            const last = comments.filter((c) => (c.body ?? "").startsWith("<!-- perf-exceeded: ")).at(-1);
            if ((last?.body ?? "").split("\n")[0] === marker) {
              core.info(`#${issue.number} already reports these measurements`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              core.info(`commented on #${issue.number}`);
            }
