# Probe for #2465, macOS: fast loop for the shell's recorders on macOS. Never merged: it lives only on the branch
# probe/2465-mac-e2e.
name: Probe 2465 mac

on:
  push:
    branches: [probe/2465-mac-e2e]

env:
  # probe (eslogger variants) or suite (the shell e2e suite)
  MODE: suite

permissions:
  contents: read

jobs:
  mac:
    name: mac (${{ github.sha }})
    timeout-minutes: 40
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Shell - Rust toolchain
        working-directory: packages/shell
        shell: bash
        run: |
          rustup toolchain install
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: shell-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/shell/Cargo.lock', 'packages/shell/rust-toolchain.toml') }}-llvm-cov-0.9.1-audit-0.22.2
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shell/target
          key: shell-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/shell/Cargo.lock', 'packages/shell/Cargo.toml', 'packages/shell/*/Cargo.toml', 'packages/shell/rust-toolchain.toml') }}-llvm-cov-0.9.1
          restore-keys: shell-target-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Shell - fetch the crates
        working-directory: packages/shell
        run: cargo fetch --locked
      - name: Shell - e2e build
        run: pnpm --filter @reqseq/shell build:e2e

      - name: Shell - recorders (macOS)
        shell: bash
        run: |
          sudo dscl . -create /Groups/reqseq-e2e
          sudo dscl . -create /Groups/reqseq-e2e PrimaryGroupID 4265
          sudo dscl . -append /Groups/reqseq-e2e GroupMembership "$USER"
          echo "$USER ALL=(ALL:ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/zz-reqseq-shell-e2e > /dev/null
          sudo chmod 440 /etc/sudoers.d/zz-reqseq-shell-e2e
          sudo visudo -c -q
          sudo dscacheutil -flushcache
          test "$(sudo -n -u "$USER" -g reqseq-e2e id -gn)" = reqseq-e2e
          echo 'REQSEQ_SHELL_E2E_RECORD=macos' >> "$GITHUB_ENV"
      - name: Shell - e2e
        timeout-minutes: 10
        run: pnpm --filter @reqseq/shell test:e2e
      - name: Shell - e2e, the recorded tests twice more
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: packages/shell
        run: |
          ./node_modules/.bin/vitest run --config vitest.shell.config.ts e2e/shell.test.ts -t 'macOS' --reporter=verbose
          ./node_modules/.bin/vitest run --config vitest.shell.config.ts e2e/shell.test.ts -t 'macOS' --reporter=verbose
      - name: Shell - remove the recorders (macOS)
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          sudo -n pkill -KILL -x eslogger || true
          sudo -n pkill -TERM -x tcpdump || true
          sudo -n pfctl -q -a com.apple/reqseq-shell-e2e -F all || true
          echo "pf rules left: $(sudo -n pfctl -a com.apple/reqseq-shell-e2e -s rules 2> /dev/null | grep -c block)"
      - name: Upload the JUnit file
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-shell-probe
          path: test-results/junit-shell.xml
          retention-days: 7
