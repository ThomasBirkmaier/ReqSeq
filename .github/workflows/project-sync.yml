name: Project sync

# Mirrors issues into the GitHub project "ReqSeq". Labels stay the source of truth.
# Every run reconciles all issues and writes only differences (#480). GitHub keeps one pending run in
# the group and cancels older pending ones, which is harmless: the last run catches up on everything.
# Needs the repository secret PROJECT_TOKEN (classic PAT, scopes repo + project);
# without it the job skips.

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  # `issue-working` labels with the workflow token, whose label events start no workflow.
  workflow_run:
    workflows: [Issue working]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Sync
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/project-sync/sync.mjs
