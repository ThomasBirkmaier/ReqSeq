name: Release

# ADR-0020 (#2308): builds the portable delivery without Electron, one archive per system with the desktop shell
# (ADR-0021, #2379), the launcher, the pinned Node, the command line with the MCP server and the UI server, the pages
# of the web UI and the documentation, and the CLI tarball; installs (unpacks) and tests it on each system (ADR-0011), and publishes it as a GitHub release.
# Only on a stage tag (`v*`) or by hand, never on pull requests or pushes (the delivery must not slow down PR CI). The
# tag releases only when it is `v<version>` of the root package.json (`v<major>.<minor>` for a patch of 0) and on
# `main`. Each system is tested on GitHub's runner of SR-249's reference system (macOS 26, Ubuntu 24.04, Windows), so
# the delivery tests of a run are the evidence for SR-249 AK1 to AK3 and SR-252 AK1 and AK8.
# Every product, artifact and launcher name comes from toolchain/packaging/names.json, the Node version and the
# SHA-256 of its archives from toolchain/packaging/node.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Git Bash on Windows.
    shell: bash

jobs:
  # The documentation that every delivery ships (SR-141, ADR-0017): the offline build of the site (base `/`, the
  # version in every title), made once on Linux with the shared steps of docs-pages.yml, and the licences of what it
  # ships checked against ADR-0015 (scripts/licenses/site.mjs). The build job stages it as lib/docs/ of the archives and
  # package/docs/ of the CLI tarball.
  docs-site:
    name: docs site
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags for the page "What's new" (#1259).
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/docs/site/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - uses: ./.github/actions/docs-site
        with:
          offline: "true"
      - name: Check the offline build and the licences of what it ships
        run: node scripts/package/stage.mjs --docs-site
      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: build/docs-site
          if-no-files-found: error
          retention-days: 1

  # The release build of the desktop shell (ADR-0021) on its system: Cargo with `tauri/custom-protocol` and without the
  # e2e driver, no Tauri CLI or bundler; with the notices of the crates it links there (scripts/licenses/crates.mjs,
  # which also fails on a licence outside ADR-0015's allowlist). The crates are fetched once with the lockfile, then
  # Cargo builds offline. The build job puts the files into the archive of the system.
  shell:
    name: shell (${{ matrix.os }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, system: mac, target: aarch64-apple-darwin, packages: -p shell }
          - {
              os: ubuntu-24.04,
              system: linux,
              target: x86_64-unknown-linux-gnu,
              packages: -p shell -p launcher,
            }
          - { os: windows-2025, system: win, target: x86_64-pc-windows-msvc, packages: -p shell }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        # Restarted when it stalls (#2436).
        run: >-
          .github/scripts/apt-retry.sh bash -c 'sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev'
      # rust-toolchain.toml names the version and its components.
      - name: Rust toolchain
        working-directory: packages/shell
        run: rustup toolchain install && rustc --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: shell-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/shell/Cargo.lock', 'packages/shell/rust-toolchain.toml') }}
      - name: Fetch the crates
        working-directory: packages/shell
        run: cargo fetch --locked
      - name: Build
        working-directory: packages/shell
        run: cargo build --release --locked --offline ${{ matrix.packages }}
      - name: Collect the build and the crate notices
        env:
          SYSTEM: ${{ matrix.system }}
          TARGET: ${{ matrix.target }}
        run: |
          out="build/shell/$SYSTEM"
          mkdir -p "$out"
          program="$(node -p 'require("./toolchain/packaging/names.json").shellProgram')"
          case "$SYSTEM" in
            win) cp "packages/shell/target/release/$program.exe" "$out/" ;;
            linux) cp "packages/shell/target/release/$program" packages/shell/target/release/ReqSeq "$out/" ;;
            *) cp "packages/shell/target/release/$program" "$out/" ;;
          esac
          node scripts/licenses/crates.mjs --notices "$TARGET" "$out/crates.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-${{ matrix.system }}
          path: build/shell/${{ matrix.system }}
          if-no-files-found: error
          retention-days: 1

  # The archives of all three systems and the CLI tarball, made once on Linux: the program is JavaScript without
  # native modules, so only the Node binary and the desktop shell differ per system.
  build:
    name: build
    needs: [docs-site, shell]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # The Node archives of node.json, downloaded once per pin and cached; stage.mjs checks each against its SHA-256
      # on every run, a cached one too. Nothing is downloaded at install or run time (SR-078 AK2).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-cache
        with:
          path: build/node-archives
          key: node-archives-${{ hashFiles('toolchain/packaging/node.json') }}
      - name: Download the Node archives
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/node-archives
          node scripts/package/stage.mjs --node-urls | while read -r url file; do
            curl -fsSL --retry 3 --max-time 600 -o "build/node-archives/$file" "$url"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: build/docs-site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shell-*
          path: build/shell
      - name: Stage and pack the archives
        run: |
          for system in mac linux win; do mv "build/shell/shell-$system" "build/shell/$system"; done
          node scripts/package/stage.mjs
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.node-cache.outputs.cache-hit != 'true'
        with:
          path: build/node-archives
          key: ${{ steps.node-cache.outputs.cache-primary-key }}
      - name: Pack the command line (CLI tarball)
        run: node scripts/package/stage.mjs --pack
      # The macOS archive goes to the job `seal` first; `delivery` and `delivery-mac` together are the delivery.
      - name: Upload the delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery
          path: |
            delivery/*.zip
            delivery/*.tar.gz
            delivery/*.tgz
            !delivery/*-mac-*.zip
          if-no-files-found: error
          retention-days: 1
      - name: Upload the macOS archive to seal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsealed-mac
          path: delivery/*-mac-*.zip
          if-no-files-found: error
          retention-days: 1

  # ADR-0021, Signing: `ReqSeq.app` sealed ad hoc on macOS, the shell's executable first, then the bundle, so the seal
  # covers Info.plist and the resources; Node in Resources keeps its own signature. This is no Developer ID signature
  # and no notarization (SR-146). The archive is packed again with ditto, which keeps the seal.
  seal:
    name: seal (macos-26)
    needs: build
    timeout-minutes: 15
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsealed-mac
          path: unsealed
      - name: Seal ReqSeq.app ad hoc
        run: |
          archive="$(ls unsealed/*-mac-*.zip)"
          name="$(basename "$archive")"
          mkdir -p work sealed
          ditto -x -k "$archive" work
          folder="work/${name%.zip}"
          app="$(ls -d "$folder"/*.app)"
          codesign --sign - --force "$app/Contents/MacOS/"*
          codesign --sign - --force "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --norsrc --keepParent "$folder" "sealed/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-mac
          path: sealed/*.zip
          if-no-files-found: error
          retention-days: 1

  # The delivery is all three archives with the sealed macOS one, so every test job waits for `seal`.
  # The delivery tests on each reference system: the archive of the system is unpacked and run, `reqseq ui` loaded in
  # Chromium, Firefox and WebKit (SR-249 AK1); the inspection of all archives runs on every system.
  test:
    name: test (${{ matrix.os }})
    needs: seal
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The tests import core, the MCP client transport and the test kit.
      - name: Build
        run: pnpm build
      # The three browsers of SR-249 AK1, downloaded once per Playwright version and system; their system libraries on
      # Linux on every run.
      - name: Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./packages/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @reqseq/web exec playwright install chromium firefox webkit
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: System libraries of the browsers (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/apt-retry.sh pnpm --filter @reqseq/web exec playwright install-deps chromium firefox webkit
      # The web engine of the desktop shell, a display and a session bus for it (SR-252 AK1); delivery-tests.sh
      # removes the engine again for the last test (SR-252 AK8).
      - name: Web engine of the desktop shell (Linux)
        if: runner.os == 'Linux'
        run: >-
          .github/scripts/apt-retry.sh bash -c 'sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 xvfb xauth dbus'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: delivery*
          merge-multiple: true
          path: delivery
      - name: Delivery tests
        env:
          # Linux: the runner is thrown away, so the last test may remove the web engine (SR-252 AK8).
          REQSEQ_DELIVERY_REMOVE_ENGINE: "1"
        run: scripts/package/delivery-tests.sh
      - name: Upload JUnit results (evidence)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-delivery-${{ matrix.os }}
          path: test-results/junit-delivery.xml
          if-no-files-found: ignore

  # Publishes the release of a stage tag: a draft first, every asset uploaded, then published. A re-run finds the
  # release of the tag and replaces assets of the same name. A tag that is not a release tag (`v<major>.<minor>`
  # or `v<major>.<minor>.<patch>`, e.g. a throwaway `v0.0.0-rc.1` to try the workflow) publishes nothing. A manual
  # run publishes nothing either and only shows the release text of its commit in the job summary (#346): the
  # summary of the version in docs/releases/ must be there, or the run fails.
  release:
    name: release
    needs: [build, seal, test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      # `true` when this run published the release of a release tag (docs below).
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches: the tag's commit must be on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "::notice::a manual run publishes nothing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::notice::$TAG is not a release tag: nothing is published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/package/stage.mjs --check-tag "$TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          echo "publish=true" >> "$GITHUB_OUTPUT"
      # The release text: the summary of docs/releases/<version>.md, the delivery part and the Conventional Commit
      # subjects since the previous release tag, folded (#346). The asset list goes in when the assets are there.
      - name: Release text
        env:
          INSTALL: https://thomasbirkmaier.github.io/ReqSeq/how-to/install-reqseq/
        run: |
          ref="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ]; then ref="$GITHUB_REF_NAME"; fi
          product="$(node -p 'require("./toolchain/packaging/names.json").productName')"
          {
            echo "Portable delivery: unpack the archive of your system and start ${product}, or run \`bin/reqseq\` (on macOS \`${product}.app/Contents/Resources/bin/reqseq\`; see [Install ${product}]($INSTALL))."
            echo
            echo "<!-- files -->"
            echo
            echo "The archives are not signed by a vendor certificate: see [the first start]($INSTALL#first-start)."
          } > delivery.md
          node scripts/package/stage.mjs --release-body "$ref" delivery.md > release-body.md
          cat release-body.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.tag.outputs.publish == 'true'
        with:
          pattern: delivery*
          merge-multiple: true
          path: release-assets
      - name: Checksums
        if: steps.tag.outputs.publish == 'true'
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          call() {
            curl -fsS --retry 3 --max-time 600 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          product="$(node -p 'require("./toolchain/packaging/names.json").productName')"
          # The release text with the list of the assets in place of its placeholder.
          files="$(for file in release-assets/*; do echo "- \`$(basename "$file")\`"; done)"
          body="$(FILES="$files" node -e 'const fs = require("node:fs"); process.stdout.write(fs.readFileSync("release-body.md", "utf8").replace("<!-- files -->", () => process.env.FILES))')"
          # A draft is not found by its tag, so the list is searched (a re-run of this job).
          release="$(call "$api/releases?per_page=100" | jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag)][0] // empty')"
          if [ -z "$release" ]; then
            release="$(jq -n --arg tag "$TAG" --arg name "$product $TAG" --arg body "$body" \
              '{tag_name: $tag, name: $name, body: $body, draft: true}' | call -X POST "$api/releases" --data @-)"
          fi
          id="$(jq -r .id <<< "$release")"
          uploads="$(jq -r '.upload_url | sub("\\{.*\\}$"; "")' <<< "$release")"
          for file in release-assets/*; do
            name="$(basename "$file")"
            old="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<< "$release")"
            if [ -n "$old" ]; then call -X DELETE "$api/releases/assets/$old"; fi
            call -X POST -H "Content-Type: application/octet-stream" --data-binary "@$file" \
              "$uploads?name=$name" > /dev/null
            echo "uploaded $name"
          done
          jq -n --arg body "$body" '{body: $body, draft: false}' | call -X PATCH "$api/releases/$id" --data @- \
            | jq -r '.html_url'

  # The user documentation of the published release on GitHub Pages (ADR-0017). Called here, not on
  # `release: published`, because a release published with `github.token` starts no workflow.
  docs:
    name: docs
    needs: release
    if: needs.release.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-pages.yml
    with:
      tag: ${{ github.ref_name }}
