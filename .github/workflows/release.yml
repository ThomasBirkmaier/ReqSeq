name: Release

# ADR-0014 (ThomasBirkmaier/ReqSeq-archive#324): builds the portable delivery of each system with electron-builder, installs (unpacks) and tests
# it (ADR-0011), and publishes it as a GitHub release. Only on a stage tag (`v*`) or by hand, never on pull requests
# or pushes (the delivery must not slow down PR CI). The tag releases only when
# it is `v<version>` of the root package.json (`v<major>.<minor>` for a patch of 0) and on `main`.
# Each system is built and tested on GitHub's runner of SR-076's reference system (macOS 26, Ubuntu 24.04,
# Windows), so the delivery tests of a run are the evidence for SR-076 AK1 and AK2.
# Every product, artifact and launcher name comes from toolchain/packaging/names.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Git Bash on Windows.
    shell: bash

jobs:
  # The documentation that every delivery ships (SR-141, ADR-0017): the offline build of the site (base `/`, the
  # version in every title), made once on Linux with the shared steps of docs-pages.yml, and the licences of what it
  # ships checked against ADR-0015 (scripts/licenses/site.mjs). The build jobs stage it as resources/cli/docs/ and
  # package/docs/ of the CLI tarball.
  docs-site:
    name: docs site
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags for the page "What's new" (#1259).
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/docs/site/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - uses: ./.github/actions/docs-site
        with:
          offline: "true"
      - name: Check the offline build and the licences of what it ships
        run: node scripts/package/stage.mjs --docs-site
      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: build/docs-site
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.os }})
    needs: docs-site
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: --mac
          - os: ubuntu-24.04
            target: --linux
          - os: windows-2025
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Build the app (electron-vite)
        run: pnpm --filter "$(node -p 'require("./toolchain/packaging/names.json").packageScope')app" build:electron
      # electron-builder has its own lockfile outside the workspace, so PR CI never installs it (ADR-0001, ADR-0014).
      - name: Install and audit electron-builder
        run: |
          pnpm install --dir toolchain/packaging --frozen-lockfile --ignore-scripts
          pnpm audit --dir toolchain/packaging --audit-level high
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: build/docs-site
      - name: Stage the app, the command line and the documentation
        run: node scripts/package/stage.mjs
      # What electron-builder downloads (the Electron zip, its tools such as 7-Zip and rcedit) is cached per system,
      # electron-builder and Electron version, so a run normally fetches nothing (#1234). The zip goes to
      # @electron/get's default cache, which electron-builder gives no setting for: env-paths("electron").cache.
      - name: Download cache folders
        id: download-cache
        run: |
          case "$RUNNER_OS" in
            macOS) electron="$HOME/Library/Caches/electron" ;;
            Windows) electron="$LOCALAPPDATA/electron/Cache" ;;
            *) electron="${XDG_CACHE_HOME:-$HOME/.cache}/electron" ;;
          esac
          {
            echo "electron=$electron"
            builder="$(node -p 'require("./toolchain/packaging/package.json").devDependencies["electron-builder"]')"
            version="$(node -p 'require("./packages/app/package.json").devDependencies.electron')"
            echo "key=electron-builder-$RUNNER_OS-$RUNNER_ARCH-$builder-electron-$version"
          } >> "$GITHUB_OUTPUT"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: download-cache-restore
        with:
          path: |
            ${{ steps.download-cache.outputs.electron }}
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ steps.download-cache.outputs.key }}
      # Called directly, not through pnpm, so electron-builder does not take the folders for a pnpm workspace.
      # No certificate is ever used: ad-hoc signature on macOS (ADR-0014).
      # A tag run reads only the caches of its tag and of main, so it misses after every change of the key until a
      # manual run on main has saved it, and then downloads everything. One download error (an HTTP 504 in the run
      # of v0.8.5, #1238) must not fail the release, so packaging is tried a second time after 30 seconds.
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NO_UPDATE_NOTIFIER: "1"
          TARGET: ${{ matrix.target }}
        run: |
          package() {
            toolchain/packaging/node_modules/.bin/electron-builder --projectDir build/package/app \
              --config "$PWD/toolchain/packaging/electron-builder.config.mjs" "$TARGET" --publish never
          }
          if ! package; then
            echo "::warning::packaging failed, trying once more in 30 seconds (#1238)"
            sleep 30
            package
          fi
      # Saved right after packaging, so that a red delivery test still fills the cache.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.download-cache-restore.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.download-cache.outputs.electron }}
            ${{ runner.temp }}/electron-builder-cache
          key: ${{ steps.download-cache-restore.outputs.cache-primary-key }}
      - name: Pack the command line (CLI tarball)
        if: runner.os == 'Linux'
        run: node scripts/package/stage.mjs --pack
      # The app start needs a display and Electron's libraries; GitHub's image has most of them. The AppArmor
      # setting of the runner is left as shipped: the test takes the documented admin step for chrome-sandbox.
      - name: Display server and libraries for Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          packages="xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libcups2t64 libatk-bridge2.0-0t64 libxkbcommon0 libdrm2"
          if ! dpkg -s $packages >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $packages
          fi
      - name: Delivery tests
        run: scripts/package/delivery-tests.sh
      - name: Upload the delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-${{ matrix.os }}
          path: |
            delivery/*.zip
            delivery/*.tar.gz
            delivery/*.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Upload JUnit results (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-delivery-${{ matrix.os }}
          path: test-results/junit-delivery.xml
          if-no-files-found: ignore

  # Publishes the release of a stage tag: a draft first, every asset uploaded, then published. A re-run finds the
  # release of the tag and replaces assets of the same name. A tag that is not a release tag (`v<major>.<minor>`
  # or `v<major>.<minor>.<patch>`, e.g. a throwaway `v0.0.0-rc.1` to try the workflow) publishes nothing. A manual
  # run publishes nothing either and only shows the release text of its commit in the job summary (#346): the
  # summary of the version in docs/releases/ must be there, or the run fails.
  release:
    name: release
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      # `true` when this run published the release of a release tag (docs below).
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches: the tag's commit must be on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "::notice::a manual run publishes nothing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::notice::$TAG is not a release tag: nothing is published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/package/stage.mjs --check-tag "$TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          echo "publish=true" >> "$GITHUB_OUTPUT"
      # The release text: the summary of docs/releases/<version>.md, the delivery part and the Conventional Commit
      # subjects since the previous release tag, folded (#346). The asset list goes in when the assets are there.
      - name: Release text
        env:
          INSTALL: https://thomasbirkmaier.github.io/ReqSeq/how-to/install-reqseq/
        run: |
          ref="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ]; then ref="$GITHUB_REF_NAME"; fi
          product="$(node -p 'require("./toolchain/packaging/names.json").productName')"
          {
            echo "Portable delivery: unpack the archive of your system and start ${product} (see [Install ${product}]($INSTALL))."
            echo
            echo "<!-- files -->"
            echo
            echo "The builds are not signed by a vendor certificate: see [the first start of the app]($INSTALL#app)."
          } > delivery.md
          node scripts/package/stage.mjs --release-body "$ref" delivery.md > release-body.md
          cat release-body.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.tag.outputs.publish == 'true'
        with:
          pattern: delivery-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        if: steps.tag.outputs.publish == 'true'
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          call() {
            curl -fsS --retry 3 --max-time 600 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          product="$(node -p 'require("./toolchain/packaging/names.json").productName')"
          # The release text with the list of the assets in place of its placeholder.
          files="$(for file in release-assets/*; do echo "- \`$(basename "$file")\`"; done)"
          body="$(FILES="$files" node -e 'const fs = require("node:fs"); process.stdout.write(fs.readFileSync("release-body.md", "utf8").replace("<!-- files -->", () => process.env.FILES))')"
          # A draft is not found by its tag, so the list is searched (a re-run of this job).
          release="$(call "$api/releases?per_page=100" | jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag)][0] // empty')"
          if [ -z "$release" ]; then
            release="$(jq -n --arg tag "$TAG" --arg name "$product $TAG" --arg body "$body" \
              '{tag_name: $tag, name: $name, body: $body, draft: true}' | call -X POST "$api/releases" --data @-)"
          fi
          id="$(jq -r .id <<< "$release")"
          uploads="$(jq -r '.upload_url | sub("\\{.*\\}$"; "")' <<< "$release")"
          for file in release-assets/*; do
            name="$(basename "$file")"
            old="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<< "$release")"
            if [ -n "$old" ]; then call -X DELETE "$api/releases/assets/$old"; fi
            call -X POST -H "Content-Type: application/octet-stream" --data-binary "@$file" \
              "$uploads?name=$name" > /dev/null
            echo "uploaded $name"
          done
          jq -n --arg body "$body" '{body: $body, draft: false}' | call -X PATCH "$api/releases/$id" --data @- \
            | jq -r '.html_url'

  # The user documentation of the published release on GitHub Pages (ADR-0017). Called here, not on
  # `release: published`, because a release published with `github.token` starts no workflow.
  docs:
    name: docs
    needs: release
    if: needs.release.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-pages.yml
    with:
      tag: ${{ github.ref_name }}
