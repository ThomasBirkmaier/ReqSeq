# A fast check of each push to main (#796): two pull requests can each be green against an older main and still break
# it together after their squash merges, since the ruleset does not require an up-to-date branch (a full run takes
# about 18 min per pull request). Typecheck and lint on Linux show such a break within minutes. A red run opens an
# issue labelled `main-red` (or comments on the open one), and a green run closes it.
name: main check

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-check
  cancel-in-progress: true

jobs:
  typecheck-lint:
    name: typecheck and lint
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

  report:
    name: report on main
    needs: typecheck-lint
    # A cancelled run (a newer push) reports nothing; its successor does.
    if: ${{ !cancelled() && needs.typecheck-lint.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RESULT: ${{ needs.typecheck-lint.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = "main-red";
            // The list holds pull requests too; only issues count.
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, labels: label, state: "open" })).filter((i) => !i.pull_request);
            const footer = "\n\n---\n_Written by the main check workflow_";
            if (process.env.RESULT === "success") {
              for (const issue of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Green again at ${context.sha} (${process.env.RUN_URL}).${footer}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
              }
              return;
            }
            const text = `Typecheck or lint failed on main at ${context.sha}: ${process.env.RUN_URL}. Fix main first; pull requests merge main only when they are red because of it (merge skill, #796).`;
            if (open.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: text + footer });
            } else {
              await github.rest.issues.create({ owner, repo, title: "main is red: typecheck or lint", labels: [label, "bug", "dev", "P1"], body: text + footer });
            }
