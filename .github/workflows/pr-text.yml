name: PR text

# Title, body and label edits only matter to trace-check, which reads the PR text (D-050). The full CI run's `static`
# job runs the same check; this workflow runs it for edits of the title or body and for the labels that trace-check
# reads. It is a workflow of its own (#372): a CI run of these events would be the newest CI run of the head commit,
# and GitHub reads the required checks from that run, where the platform jobs show no system in their names.
# When this check passes and the required job `static` of the head commit's CI run failed only in its Trace check step
# (a label `enabler` or a PR text fixed after that step), this workflow re-runs that job once its run has completed:
# this check is not required, and agents cannot re-run jobs themselves (product owner decision,
# 2026-10-30).

on:
  pull_request:
    types: [edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  # Only the runs that check share a group. An event the job skips (a label other than `enabler` or `spec-export`, an
  # edit of the base branch only) gets a group of its own, so that it never cancels a running check (#566).
  group: pr-text-${{ github.event.pull_request.number }}-${{ ((github.event.action == 'edited' && (github.event.changes.title || github.event.changes.body)) || (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && contains(fromJSON('["enabler","spec-export"]'), github.event.label.name))) && 'check' || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-text:
    name: trace-check (PR text)
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.state == 'open' &&
      ((github.event.action == 'edited' && (github.event.changes.title || github.event.changes.body)) ||
      (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
      contains(fromJSON('["enabler","spec-export"]'), github.event.label.name)))
    permissions:
      contents: read
      pull-requests: read # Write PR body
      actions: write # Re-run static
    runs-on: ubuntu-24.04
    # The check takes about a minute; the rest is the wait for the CI run before re-running `static`.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # No pnpm cache: the root's devDependencies (about 160 packages; trace-check needs `yaml`, #326) download
      # faster than the whole store's cache restores.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install the root's dependencies only
        run: pnpm install --frozen-lockfile --filter reqseq --ignore-scripts
      - name: Write PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        # The pull request as it is now, not as the event saw it: a label added right after opening the pull
        # request (`enabler`) counts in the run of `opened` too, and a re-run reads the current text (#571).
        run: |
          curl -fsS --retry 3 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$PR_URL" > pr.json
          jq -r '.title + "\n\n" + (.body // "")' pr.json > pr-body.txt
          jq -r '[.labels[].name] | any(. == "enabler" or . == "spec-export")' pr.json > pr-enabler.txt
      - name: Trace check
        run: |
          args="--pr-body pr-body.txt"
          if [ "$(cat pr-enabler.txt)" = "true" ]; then args="$args --enabler"; fi
          node scripts/trace-check/trace-check.mjs $args --report trace-report.md
      - name: Report
        if: always()
        run: cat trace-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Re-run static
        # A pull request from a fork or by Dependabot gets no write token. A later event cancels this wait (concurrency) and waits
        # itself. A push makes a new CI run that reads the PR text itself, so the old run is never re-run: its
        # re-run would join the pull request's CI group and cancel the new run.
        if: >-
          success() && github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const deadline = Date.now() + 40 * 60 * 1000;
            let run;
            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "ci.yml", event: "pull_request", head_sha: process.env.HEAD_SHA, per_page: 20,
              });
              // The newest run of the head commit is the one GitHub reads the required checks from.
              run = data.workflow_runs.sort((a, b) => b.run_number - a.run_number)[0];
              if (!run) return core.info("No CI run of the head commit");
              // GitHub re-runs a job only once its whole run has completed.
              if (run.status === "completed") break;
              if (Date.now() > deadline) return core.warning(`CI run ${run.html_url} did not complete in time`);
              await new Promise((resolve) => setTimeout(resolve, 30 * 1000));
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: "latest", per_page: 100,
            });
            const job = jobs.find((j) => j.name === "static");
            if (!job || job.conclusion !== "failure") return core.info(`static: ${job?.conclusion ?? "missing"}`);
            const failed = job.steps.filter((step) => step.conclusion === "failure").map((step) => step.name);
            if (failed.length === 0 || failed.some((name) => name !== "Trace check")) {
              return core.info(`static failed in ${failed.join(", ") || "no step"}, not only in Trace check`);
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
            if (pr.head.sha !== process.env.HEAD_SHA) return core.info("The head commit changed; its own run checks");
            await github.rest.actions.reRunJobForWorkflowRun({ owner, repo, job_id: job.id });
            core.info(`Re-running ${job.html_url}`);
