name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  # No run on a push to main: every pull request is fully checked before its merge,
  # and with three runners the main runs only queued up and were cancelled by the next merge. The nightly run and the
  # manual run check main; a red nightly run is fixed the next morning, through a pull request to main (#340).
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Title, body, label and base branch edits start no run (#372): a CI run of such an event would be the newest run of
  # the head commit, and GitHub reads the required checks from it, where the platform jobs are skipped under a name
  # without the system. No check reads the PR text; after a change of the base branch, the next push checks the code
  # against the new base (`pnpm merge:main`).
  # Closing or merging a pull request joins the full group and so cancels its queued or running full run; the
  # run of `closed` starts no job (no runner time for pull requests that are done).
  # Marking a pull request ready for review joins the full group too (#412): its run checks both lanes, so it may cancel
  # the draft run of the same commit.
  # Scheduled and manual runs get their own groups, so that a pull request never cancels a nightly or a manual run.
  # Keyed on the pull request's number, because the `closed` run of a merged pull request may carry the base branch as
  # its ref.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.event.schedule) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || 'full' }}
  cancel-in-progress: true

# Runners: every job runs on GitHub's hosted runners, never on a self-hosted one (a public repository must not
# run code from pull requests on a machine of its own).
# Two lanes (#303, #412): every push starts the Ubuntu lane (`static` and `checks` on ubuntu-24.04). A draft
# pull request stops there, so the pushes while it is worked on cost a few runner minutes each. On a pull request that
# is not a draft (marking it ready included), the nightly and the manual run the platform lane runs at the same time:
# `checks` on macos-26 and windows-2025.
# The lanes ran one after the other while runner minutes cost money; in a public repository they are free, and in
# sequence a full run took about 24 minutes instead of about 15 (#412). So every pull request is checked on all
# three systems before its merge (merge skill), but not every push.

jobs:
  # Static checks: they do not depend on the operating system and need no build, so Ubuntu only and apart from the
  # tests (#303). Each step after the install runs even when an earlier one failed (`!cancelled()`), so that one red
  # step never hides another result; the job is red if any step is.
  static:
    name: static
    # A normal run takes 2-3 minutes; the bound ends a hang early.
    timeout-minutes: 8
    if: ${{ github.event.action != 'closed' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its parents: the first parent is the base branch (size warning).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      # Large pull requests run long and are hard to review (#303): over 800 changed lines, the generated files of
      # .gitattributes not counted, the job shows a warning. It never fails the job. A moved file counts only its
      # changed lines.
      - name: Pull request size
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          lines="$(git diff --numstat -M HEAD^1 HEAD -- . ':(exclude)schemas/generated' \
            ':(exclude)packages/core/src/generated' ':(exclude)pnpm-lock.yaml' \
            ':(exclude)docs/architecture/*.svg' |
            awk '$1 != "-" { n += $1 + $2 } END { print n + 0 }')"
          echo "Changed lines without generated files: $lines" >> "$GITHUB_STEP_SUMMARY"
          if [ "$lines" -gt 800 ]; then
            echo "::warning title=Pull request size::$lines changed lines without generated files (over 800): split the pull request unless its change is inseparable (merge skill)."
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check
      - name: Schemas
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm schemas:check
      - name: Generated contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm contracts:check
      - name: Licenses
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm licenses:check
      - name: Audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --prod --audit-level high
      # The dev packages run on the build machine too (vite, Playwright),
      # so the nightly and the manual run audit them as well (#938). Pull requests keep the production audit only.
      - name: Audit, dev packages included
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name != 'pull_request' }}
        run: pnpm audit --audit-level high
      # trace-check reads the ReqSeq workspace in spec/ with the `yaml` package (ThomasBirkmaier/ReqSeq-archive#326) and the test names; no PR text.
      - name: Trace check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/trace-check/trace-check.mjs --report trace-report.md
      - name: Trace report
        if: always()
        run: cat trace-report.md >> "$GITHUB_STEP_SUMMARY" || true

  # Whether the steps of the desktop shell run in `checks` (ADR-0021, Lean CI): `.github/scripts/tests-needed.sh shell`,
  # the base branch's copy, on a pull request. A job of its own, because the time bounds of `checks` grow only when
  # those steps run, and a job's bound cannot read a step of the same job. Nightly and manual runs leave the output
  # empty, and empty means "run". If the classifier fails, the output is `true`.
  shell-scope:
    name: shell scope
    timeout-minutes: 3
    if: ${{ github.event.action != 'closed' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      shell: ${{ steps.scope.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Changed files
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          shell="$(git diff --name-only --no-renames HEAD^1 HEAD | bash <(git show HEAD^1:.github/scripts/tests-needed.sh) shell)" || shell=true
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "Desktop shell steps needed: \`$shell\`" >> "$GITHUB_STEP_SUMMARY"

  # Build, unit tests with coverage (ADR-0016), the spec check and the CLI e2e suite (ADR-0011), on Ubuntu in the
  # Ubuntu lane. `checks-platform` runs the same steps on macOS and Windows.
  # SR-249: Windows 11, macOS 26 and Ubuntu 24.04 are the reference systems.
  checks:
    name: checks (ubuntu-24.04)
    # A pull request run takes about 10 minutes, but about 1 in 4 hosted runners is about 1.5 times slower in every step,
    # and there it takes 14-17 minutes (#1994); the bound of 15 cancelled green runs. The performance suite's assertions
    # on a small workspace add about 1 minute, 1.5 on a slow runner (#2037). 22 leaves about 3 minutes over the slowest
    # healthy run and still ends a hang. The nightly gets up to 5 more for the status model step. The steps of the
    # desktop shell add 15 more when they run (ADR-0021): cold, without the build cache (#2434), clippy, the coverage
    # build and the e2e build took about 3.5 minutes on 4 cores, plus the system packages, the cargo tools and the e2e
    # suite (#2377).
    timeout-minutes: ${{ github.event_name == 'schedule' && 42 || needs.shell-scope.outputs.shell != 'false' && 37 || 22 }}
    needs: shell-scope
    # `!cancelled()`: a failed `shell-scope` must not skip this job (a skipped required job counts as passed); its
    # empty output then runs the shell steps.
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    steps: &checks-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its parents: the first parent is the base branch (changed files).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Pull requests that change only files no test or build reads (docs, agent rules, verification records,
      # Markdown at the root; .github/scripts/tests-needed.sh) skip the build, the unit tests, the spec check and
      # e2e, to save runner time (ThomasBirkmaier/ReqSeq-archive#520). Nightly and manual runs always run
      # everything. If this step fails, `tests` stays empty and everything runs (and the job is red).
      - name: Changed files
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # --no-renames: a file moved from packages/ to docs/ lists both paths.
          files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          # The base branch's copy of the classifier decides, not the pull request's own.
          tests="$(bash <(git show HEAD^1:.github/scripts/tests-needed.sh) <<< "$files")"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          {
            echo "Build, tests, spec check and e2e needed: \`$tests\` for $(printf '%s\n' "$files" | grep -c .) changed files:"
            echo '```'
            printf '%s\n' "$files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.tests != 'false' }}
        run: pnpm build
      # The ReqIF 1.2 XSDs for the validator tests (ADR-0013): downloaded before the tests, which block the network,
      # cache first and pinned by SHA-256; a failed download and a hash mismatch are separate errors.
      - name: ReqIF XSDs
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.tests != 'false' }}
        timeout-minutes: 3
        uses: ./.github/actions/reqif-xsd
      # Nightly and manual runs download them fresh into another folder, past the cache, and compare the hashes, so
      # an upstream change or outage shows here first and under its own name, not as broken code.
      - name: ReqIF XSD upstream (omg.org, w3.org)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' && github.event_name != 'pull_request' }}
        timeout-minutes: 3
        shell: bash
        run: node scripts/reqif-xsd/fetch.mjs "$RUNNER_TEMP/reqif-xsd-upstream" --fresh
      # Coverage and its thresholds (ADR-0016) are measured on Linux and macOS. On Windows the unit tests run without
      # coverage (#304): tests of symbolic links, special files and execute bits are skipped there, so the per-file
      # 100 % cannot be reached on that system.
      # Its own bound, about 20 % over the slowest green Windows run (26.1 minutes, #2039): a hang ends here, names
      # this step and leaves the job time for the steps after it. Ubuntu and macOS end within their job bounds first.
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 32
        run: ${{ runner.os != 'Windows' && 'pnpm test:coverage' || 'pnpm test' }}
      # The spec check dates element versions from Git history; the shallow checkout above has none, which gave a
      # "no date" warning per outdated relation (#453). The full history of the checked-out commit takes seconds.
      - name: Full history for the spec check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow --no-tags origin "$(git rev-parse HEAD)"
          fi
      # The spec is a ReqSeq workspace (ThomasBirkmaier/ReqSeq-archive#326): ReqSeq checks it like any other (exit 1 on errors).
      # It also fails when an element that is not a draft lacks a relation the metamodel requires (#1306).
      - name: Check the spec with ReqSeq
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm spec:check

      # ADR-0011: CLI end-to-end tests spawn the built `reqseq` on fixture workspaces (packages/cli/test/e2e/),
      # including the local API and the MCP server.
      - name: CLI e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os != 'Linux' }}
        run: pnpm test:e2e
      # On Linux the suite runs inside a user and network namespace (`unshare -rn`): no network at all.
      - name: CLI e2e without network (unshare -rn)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          # Ubuntu 24.04 lets AppArmor block unprivileged user namespaces; allow them for this job only.
          # If unshare still fails, the step fails: the offline run is never skipped silently.
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Loopback inside the namespace, and up, so API tests on 127.0.0.1 work there too (ThomasBirkmaier/ReqSeq-archive#125).
          # Plus a dummy interface with a documentation address (198.51.100.1, RFC 5737; the tests use 192.0.2.1 as one that is not here), so the test
          # of SR-079 AK2 has an address other machines would use (#1363). The namespace cannot load the module itself.
          # REQSEQ_E2E_EXTERNAL_ADDRESS makes that test fail instead of skip when the address is missing.
          sudo modprobe dummy numdummies=0
          REQSEQ_E2E_EXTERNAL_ADDRESS=required unshare -rn sh -c 'ip link set lo up && ip link add reqseq0 type dummy && ip addr add 198.51.100.1/32 dev reqseq0 && ip link set reqseq0 up && exec ./node_modules/.bin/vitest run --config vitest.e2e.config.ts'

      # The assertions of the Vitest performance suite (counts, findings, output shapes) on a generated workspace of
      # 500 elements and 2,000 relations, a few files at a minimum of their own (`perfSize`, #2037; perf.yml runs it at
      # 50,000), so an output change that breaks them shows in the pull request, not first in the nightly run. Linux
      # only and without network, like e2e above; about 1 minute. No times are asserted or recorded and no JUnit file
      # is written (vitest.perf.config.ts): the record and the evidence of tagged AKs come only from the full size.
      # The bound of 4 minutes (about 1.5 on a slow runner) fails this step, not the whole job, when a perf file runs at
      # full size here (#2074; packages/testkit/src/perf-files.test.ts checks that every file takes `perfSize`).
      - name: Performance suite assertions on a small workspace, without network (unshare -rn)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 4
        env:
          REQSEQ_PERF_ELEMENTS: "500"
        run: |
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rn sh -c 'ip link set lo up && exec ./node_modules/.bin/vitest run --config vitest.perf.config.ts'

      # ADR-0017: the user documentation site is generated and built on every pull request that needs the tests,
      # Linux only. The site (Astro, Starlight) has its own lockfile outside the workspace; only these steps and
      # docs-pages.yml install it. The build runs without network, so Astro and the search index must not download anything,
      # and the links validator fails it on a dead internal link.
      - name: Docs - generate the content
        id: docs-generate
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: pnpm docs:generate
      - name: Docs - install the site
        id: docs-install
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: pnpm docs:install
      # `pnpm audit --prod` above sees only the workspace; the site's dev packages are audited here.
      # Without `--ignore-workspace`, so that the site's own `pnpm-workspace.yaml` and its audit exceptions apply (#1820).
      - name: Docs - audit the site's dependencies
        if: ${{ !cancelled() && steps.docs-install.outcome == 'success' }}
        run: pnpm audit --dir packages/docs/site --audit-level high
      # The licences of what the site ships with a delivery (ADR-0015, SR-141), so a pull request sees a change.
      - name: Docs - check the licences the site ships
        if: ${{ !cancelled() && steps.docs-install.outcome == 'success' }}
        run: node scripts/licenses/site.mjs
      - name: Docs - build the site without network (unshare -rn)
        if: ${{ !cancelled() && steps.docs-generate.outcome == 'success' && steps.docs-install.outcome == 'success' }}
        run: |
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rn node packages/docs/site/run.mjs build
      # The variant a delivery ships (release job `docs-site`): its maps must name only the packages the licence step
      # above checks, and its files must match the allow-list (`stage.mjs --docs-site`), so a new client package fails
      # here and not only in the release. A few seconds; it replaces the Pages build in dist/. The docs theme of the
      # HTML export (`docs-theme.generated.ts`, SR-231 AK4) must be what this build gives.
      - name: Docs - check the offline site a delivery ships
        if: ${{ !cancelled() && steps.docs-generate.outcome == 'success' && steps.docs-install.outcome == 'success' }}
        env:
          REQSEQ_DOCS_OFFLINE: "1"
          REQSEQ_DOCS_SITE: ${{ runner.temp }}/docs-site
        run: |
          pnpm docs:generate
          unshare -rn node packages/docs/site/run.mjs build
          node scripts/package/stage.mjs --docs-site
          pnpm docs:export-theme --check

      # ADR-0021: the desktop shell (packages/shell/, Rust and Tauri) when `shell-scope` asks for it. The same steps run
      # on all three systems, with `runner.os` guards for the setup. Cargo fetches the crates once with the lockfile;
      # every later cargo call is offline.
      - name: Shell - system packages (Linux)
        id: shell-packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.shell-scope.outputs.shell != 'false' && runner.os == 'Linux' }}
        # Restarted when it stalls (#2436). A slow mirror took up to 12.5 minutes for a green run on 2026-11-23; the
        # step bound leaves room for that and ends a hang that makes progress.
        timeout-minutes: 20
        run: >-
          .github/scripts/apt-retry.sh bash -c 'sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev xvfb xauth strace dbus'
      - name: Shell - Rust toolchain
        id: shell-toolchain
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.shell-scope.outputs.shell != 'false' && steps.shell-packages.outcome != 'failure' }}
        working-directory: packages/shell
        shell: bash
        # rust-toolchain.toml names the version and its components. No incremental artifacts and no debug info in the
        # test builds (#2434): CI builds each commit once, panics still name file and line, and the build folder in the
        # cache below stays small and links faster. The release build (release.yml) has its own profile.
        run: |
          rustup toolchain install
          rustc --version
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
      # The crates and the two cargo tools, keyed on the lockfile and the tool versions.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.shell-toolchain.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-llvm-cov*
            ~/.cargo/bin/cargo-audit*
          key: shell-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/shell/Cargo.lock', 'packages/shell/rust-toolchain.toml') }}-llvm-cov-0.9.1-audit-0.22.2
      # The build folder with the compiled dependencies (#2434), keyed on the lockfile, the manifests, the toolchain and
      # the cargo-llvm-cov version. Only runs that are not pull requests save it (the nightly and manual runs, on `main`
      # for the entry pull requests read), with the shell's own crates pruned (step `Shell - prune the build folder`), so
      # pull requests share one entry per system and fill no cache quota of their own. A pull request falls back to the
      # newest entry of its system when the key changed; a run on `main` starts cold then, so the entry holds no crates
      # the lockfile dropped. Bump the `v1` when the cargo settings of the toolchain step change.
      - name: Shell - restore the build folder
        id: shell-target
        if: ${{ !cancelled() && steps.shell-toolchain.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shell/target
          key: shell-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/shell/Cargo.lock', 'packages/shell/Cargo.toml', 'packages/shell/*/Cargo.toml', 'packages/shell/rust-toolchain.toml') }}-llvm-cov-0.9.1
          restore-keys: ${{ github.event_name == 'pull_request' && format('shell-target-v1-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Shell - fetch the crates
        id: shell-fetch
        if: ${{ !cancelled() && steps.shell-toolchain.outcome == 'success' }}
        working-directory: packages/shell
        run: cargo fetch --locked
      - name: Shell - cargo tools (Linux)
        id: shell-tools
        if: ${{ !cancelled() && steps.shell-toolchain.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          command -v cargo-llvm-cov >/dev/null || cargo install --locked cargo-llvm-cov@0.9.1
          command -v cargo-audit >/dev/null || cargo install --locked cargo-audit@0.22.2
      - name: Shell - format
        if: ${{ !cancelled() && steps.shell-fetch.outcome == 'success' }}
        working-directory: packages/shell
        run: cargo fmt --all --check
      # The `e2e` feature included, so that the driver is linted too (ADR-0021, Quality gates).
      - name: Shell - lint
        if: ${{ !cancelled() && steps.shell-fetch.outcome == 'success' }}
        working-directory: packages/shell
        run: cargo clippy --locked --offline --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic
      # Linux measures the coverage of the libraries at 100 % per file (ADR-0016, ADR-0021); the other systems run the
      # same tests without it.
      - name: Shell - unit tests
        if: ${{ !cancelled() && steps.shell-fetch.outcome == 'success' && runner.os != 'Linux' }}
        working-directory: packages/shell
        run: cargo test --locked --offline --workspace
      - name: Shell - unit tests with coverage (Linux)
        if: ${{ !cancelled() && steps.shell-fetch.outcome == 'success' && steps.shell-tools.outcome == 'success' }}
        working-directory: packages/shell
        run: cargo llvm-cov --locked --offline --workspace --lib --show-missing-lines --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100
      # The licences of the crates the shell ships, against ADR-0015's allowlist, for the three release targets.
      - name: Shell - crate licences (Linux)
        if: ${{ !cancelled() && steps.shell-fetch.outcome == 'success' && runner.os == 'Linux' }}
        run: node scripts/licenses/crates.mjs
      # The RustSec database; an advisory that is not informational fails the step. The lockfile is the same on every
      # system, so Linux checks it once.
      - name: Shell - audit (Linux)
        if: ${{ !cancelled() && steps.shell-fetch.outcome == 'success' && steps.shell-tools.outcome == 'success' }}
        working-directory: packages/shell
        run: cargo audit
      - name: Shell - e2e build
        id: shell-e2e-build
        if: ${{ !cancelled() && steps.shell-fetch.outcome == 'success' }}
        run: pnpm --filter @reqseq/shell build:e2e
      # The audit the e2e suite's recorder on Windows reads (packages/shell/e2e/record-windows.ts, ADR-0021 A8): process
      # creation with command lines (4688), refused connections (5157), the DNS client log (3006), and every firewall
      # profile on. The Security log gets 256 MB, so that it does not wrap during the recorded run. The suite adds and
      # removes its own firewall rules and ETW trace. Without the variable this step sets, the recorded tests fail in CI
      # instead of skipping.
      - name: Shell - recorders (Windows)
        if: ${{ !cancelled() && steps.shell-e2e-build.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:enable
          if ($LASTEXITCODE -ne 0) { exit 1 }
          auditpol /set /subcategory:"{0CCE9226-69AE-11D9-BED3-505054503030}" /failure:enable
          if ($LASTEXITCODE -ne 0) { exit 1 }
          reg add HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System\Audit /v ProcessCreationIncludeCmdLine_Enabled /t REG_DWORD /d 1 /f
          if ($LASTEXITCODE -ne 0) { exit 1 }
          wevtutil sl Microsoft-Windows-DNS-Client/Operational /e:true
          if ($LASTEXITCODE -ne 0) { exit 1 }
          wevtutil sl Security /ms:268435456
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-NetFirewallProfile -All -Enabled True
          Get-NetFirewallProfile | Format-Table Name, Enabled, DefaultOutboundAction -AutoSize
          Add-Content -Path $env:GITHUB_ENV -Value 'REQSEQ_SHELL_E2E_RECORD=windows'
      # The e2e suite (packages/shell/e2e/) starts the shell with the CLI of the checkout. On Linux it runs without
      # network, on a virtual display and with a session bus of its own, and records the shell with strace (A8); on
      # Windows it records with the event log, ETW and firewall rules.
      - name: Shell - e2e
        if: ${{ !cancelled() && steps.shell-e2e-build.outcome == 'success' && runner.os != 'Linux' }}
        timeout-minutes: 10
        run: pnpm --filter @reqseq/shell test:e2e
      # When the suite is cancelled at its bound, its own cleanup does not run: the firewall rules and the system-wide
      # Kernel-File trace of record-windows.ts would stay for the rest of the job.
      - name: Shell - remove the recorders (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        continue-on-error: true
        shell: pwsh
        run: |
          logman stop reqseq-shell-e2e -ets 2>&1 | Out-Null
          Get-NetFirewallRule -Group reqseq-shell-e2e -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          "firewall rules left: $(@(Get-NetFirewallRule -Group reqseq-shell-e2e -ErrorAction SilentlyContinue).Count)"
          # `logman stop` fails when the suite already stopped the trace; that is the normal case.
          $global:LASTEXITCODE = 0
      - name: Shell - e2e without network (unshare -rn, Linux)
        if: ${{ !cancelled() && steps.shell-e2e-build.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 10
        working-directory: packages/shell
        run: |
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rn sh -c 'ip link set lo up && exec xvfb-run -a dbus-run-session -- ./node_modules/.bin/vitest run --config vitest.shell.config.ts'
      # After the last cargo build and the e2e suite: the shell's own crates are built from the checkout anyway, so
      # only the dependencies go into the cache (the coverage build's folder too, on Linux). A failure here only skips
      # the save; it never fails the checks.
      - name: Shell - prune the build folder
        id: shell-prune
        continue-on-error: true
        if: >-
          ${{ !cancelled() && github.event_name != 'pull_request' && steps.shell-e2e-build.outcome == 'success' &&
          steps.shell-target.outputs.cache-hit != 'true' }}
        working-directory: packages/shell
        shell: bash
        run: |
          cargo clean --offline -p shell -p launcher
          if [ -d target/llvm-cov-target ]; then
            cargo clean --offline -p shell -p launcher --target-dir target/llvm-cov-target
          fi
          du -sh target
      - name: Shell - save the build folder
        if: ${{ !cancelled() && steps.shell-prune.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shell/target
          key: ${{ steps.shell-target.outputs.cache-primary-key }}

      # The status model properties (epic #1389) again with a random seed and more runs, in the nightly run only; pull
      # requests keep the fixed seeds. The seed is printed first, so a red run replays with it. The dot reporter leaves
      # the JUnit file of the unit tests (the evidence) as it is. It runs last before the uploads, so a slow run never cancels
      # the steps that give evidence. About 2 minutes on Linux; fewer workspaces on disk off Linux, where files are slow.
      - name: Status model, random seed
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'schedule' }}
        timeout-minutes: 5
        shell: bash
        env:
          STATUS_MODEL_RUNS: "10000"
          STATUS_MODEL_FILE_RUNS: ${{ runner.os == 'Linux' && '200' || '50' }}
        run: |
          STATUS_MODEL_SEED=$(node -e 'console.log(require("node:crypto").randomInt(2147483647))')
          echo "STATUS_MODEL_SEED=$STATUS_MODEL_SEED STATUS_MODEL_RUNS=$STATUS_MODEL_RUNS STATUS_MODEL_FILE_RUNS=$STATUS_MODEL_FILE_RUNS"
          STATUS_MODEL_SEED=$STATUS_MODEL_SEED pnpm vitest run packages/core/src/evidence/status-model --reporter=dot
      # Evidence: the unit tests' and the e2e suite's JUnit files, as separate artifacts as before.
      - name: Upload JUnit results of the unit tests (evidence)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os || 'ubuntu-24.04' }}
          path: |
            test-results/
            !test-results/junit-e2e.xml
            !test-results/junit-shell.xml
          if-no-files-found: ignore
      - name: Upload JUnit results of the e2e suite (evidence)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-e2e-${{ matrix.os || 'ubuntu-24.04' }}
          path: test-results/junit-e2e.xml
          if-no-files-found: ignore
      - name: Upload JUnit results of the shell's e2e suite (evidence)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-shell-${{ matrix.os || 'ubuntu-24.04' }}
          path: test-results/junit-shell.xml
          if-no-files-found: ignore

  # The platform lane (#303, #412): the steps of `checks` on macOS 26 and Windows 2025, in parallel
  # to the Ubuntu lane. A pull request runs it only when it is not a draft. A skipped platform job shows its name
  # without the system (`checks (${{ matrix.os }})`), so a draft never shows the required names, and the merge skill asks
  # for the jobs of all three systems to be present and green.
  checks-platform:
    name: checks (${{ matrix.os }})
    # A normal run takes 19 (macOS) to 26 (Windows) minutes; the bound ends a hang. On macOS, green jobs of 2026-11-20
    # to 23 without the shell steps took 18.5 to 19.4 minutes in the median and up to 21.8, and a runner about 1.4 times
    # slower than the median was cancelled at the old bound of 25 with every test green (#2163); 30 leaves room for such
    # a runner. Windows runs its unit tests with 2 workers instead of 3 (vitest.config.ts, #701): the 163 green Windows jobs of 2026-11-17 to 20 took 25.9 minutes
    # in the median and up to 34.1, their unit tests up to 26.1, and a runner 6 % slower than that hit the old bound
    # of 35 with every test green (#2039). 42 is about 20 % over the slowest green job and still ends a hang.
    # The steps of the desktop shell add 15 more on Windows and 10 on macOS when they run (ADR-0021, see `checks`);
    # green macOS jobs with them took up to 24.5 minutes.
    timeout-minutes: >-
      ${{ matrix.os == 'windows-2025' && (needs.shell-scope.outputs.shell != 'false' && 57 || 42) ||
      (needs.shell-scope.outputs.shell != 'false' && 40 || 30) }}
    needs: shell-scope
    # `!cancelled()` as in `checks`.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps: *checks-steps

  # The UI tests of the web UI (ADR-0020, Tests): Playwright drives Chromium against the UI server, which the tests
  # start on generated workspaces (packages/web/test/); the contract tests (SR-248, SR-078 AK3) run in Firefox and
  # WebKit too. Ubuntu only, in the Ubuntu lane, without network. Their JUnit file is evidence: the artifact
  # junit-web-ubuntu-24.04 (evidence.yml).
  web:
    name: web (ubuntu-24.04)
    # Every run installs the system libraries of Firefox and WebKit and runs the contract tests in the three browsers,
    # after the install and the build; the bound ends a hang. A normal run takes 6-8 minutes; on a slow mirror
    # `System libraries of the browsers` alone took 7 to 14 minutes on 2026-11-23 (#2436), hence 25.
    timeout-minutes: 25
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      # As in `checks`: a pull request that changes only docs skips the rest of this job.
      - name: Changed files
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          tests="$(git diff --name-only --no-renames HEAD^1 HEAD | bash <(git show HEAD^1:.github/scripts/tests-needed.sh))"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changes.outputs.tests != 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.tests != 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.tests != 'false'
        run: pnpm install --frozen-lockfile
      # The browsers (Chromium's headless shell, Firefox and WebKit) are downloaded once per Playwright version, not on
      # every run.
      - name: Playwright version
        id: playwright
        if: steps.changes.outputs.tests != 'false'
        shell: bash
        run: |
          echo "version=$(node -p "require('./packages/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        if: steps.changes.outputs.tests != 'false'
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-chromium-shell-firefox-webkit-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Browsers
        if: steps.changes.outputs.tests != 'false' && steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @reqseq/web exec playwright install --only-shell chromium firefox webkit
      # Saved right after the download, so that a red test run still fills the cache.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.tests != 'false' && steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      # The system libraries Firefox and WebKit need (apt), on every run: the cache holds only the browsers.
      - name: System libraries of the browsers
        if: steps.changes.outputs.tests != 'false'
        # Restarted when it stalls (#2436); the step bound as in `Shell - system packages (Linux)`.
        timeout-minutes: 20
        run: .github/scripts/apt-retry.sh pnpm --filter @reqseq/web exec playwright install-deps firefox webkit
      # Core, the API (the UI server), the CLI the contract tests start, the test kit for the test starter, and the
      # pages (vite build).
      - name: Build
        if: steps.changes.outputs.tests != 'false'
        run: pnpm build
      # The guide's screenshots of main's last nightly or manual run (saved below), the reference of the step "Guide
      # screenshots changed" (#1258). Restored to the folder they were saved from, then moved aside, since Playwright
      # empties test-results/web/ before it writes the new ones there.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: main-screenshots
        if: github.event_name == 'pull_request' && steps.changes.outputs.tests != 'false'
        with:
          path: test-results/web/guide-images
          key: guide-images-main-none
          restore-keys: guide-images-main-
      - name: Screenshots of main aside
        if: github.event_name == 'pull_request' && steps.changes.outputs.tests != 'false'
        run: |
          if [ -d test-results/web/guide-images ]; then
            mkdir -p build && mv test-results/web/guide-images build/guide-images-main
          fi
      # Inside a user and network namespace (`unshare -rn`) with loopback only, as the CLI e2e suite: no network at all.
      - name: UI tests without network (unshare -rn)
        if: steps.changes.outputs.tests != 'false'
        working-directory: packages/web
        run: |
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rn sh -c 'ip link set lo up && exec ./node_modules/.bin/playwright test --config test/playwright.config.ts'
      # The guide's screenshots (ADR-0017): the project `guide` has just made them (test-results/web/guide-images/). A
      # nightly or manual run on main keeps them as the reference of later pull requests (a few hundred KB; each run
      # saves a new entry, the restore takes the newest, and GitHub evicts an entry unused for 7 days). Only a run whose UI
      # tests passed saves them, so a reference never holds the shots of a broken page.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('test-results/web/guide-images/*.png') != ''
        with:
          path: test-results/web/guide-images
          key: guide-images-main-${{ github.run_id }}-${{ github.run_attempt }}
      # On a pull request this compares them with main's and writes a warning and the step summary for each one that
      # differs in more than 0.05 % of its pixels, unless the pull request changed its copy in docs/guide/images/,
      # so the author runs `pnpm docs:screenshots` (#1258). Main's come from the same runner image; the committed
      # copies would not do, since another machine's rendering moves more pixels than a changed layout. A pull request
      # merged after main's last run shows as a difference until the next nightly run. It never fails the job, since a
      # rendering detail is no error.
      - name: Guide screenshots changed
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.changes.outputs.tests != 'false' }}
        continue-on-error: true
        env:
          GUIDE_IMAGES_MAIN_KEY: ${{ steps.main-screenshots.outputs.cache-matched-key }}
        run: |
          # HEAD is the merge commit of the pull request and HEAD^1 its base (checkout with fetch-depth 2).
          GUIDE_IMAGES_UPDATED="$(git diff --name-only HEAD^1 HEAD -- docs/guide/images/)" \
            node packages/docs/dist/guide-images-bin.js
      - name: Upload JUnit results of the UI tests (evidence)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-web-ubuntu-24.04
          path: test-results/junit-web.xml
          if-no-files-found: ignore
      - name: Upload the traces of failed UI tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui-results
          path: test-results/web/
          if-no-files-found: ignore

  # The cross-access consistency test (SR-080, packages/cli/test/cross-access.test.ts) runs in `checks` on all
  # three systems; the e2e suite also runs
  # `reqseq serve api` and `reqseq mcp` as processes (servers.test.ts).
  # The performance suite with 50,000 elements runs apart, nightly and on PRs labelled `perf`: perf.yml; its Vitest
  # assertions run in `checks (ubuntu-24.04)` on a small workspace (#2037).
