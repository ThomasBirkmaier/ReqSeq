name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  # No run on a push to main (product owner decision, 2026-10-28): every pull request is fully checked before its merge,
  # and with three runners the main runs only queued up and were cancelled by the next merge. The nightly run and the
  # manual run check main; a red nightly run is fixed the next morning, through a pull request to main (#340).
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Title, body and label edits run trace-check in pr-text.yml, not here (#372): a CI run of such an event would be the
  # newest run of the head commit, and GitHub reads the required checks from it, where the platform jobs are skipped
  # under a name without the system. A change of the base branch therefore starts no run either; the next push checks
  # the code against the new base (`pnpm merge:main`).
  # Closing or merging a pull request joins the full group and so cancels its queued or running full run; the
  # run of `closed` starts no job (product owner decision, 2026-10-28: no runner time for pull requests that are done).
  # Marking a pull request ready for review gets a group of its own (#303): it must not cancel the Ubuntu lane that
  # still runs on the same commit, because a cancelled check on the head commit blocks the merge (merge.md).
  # Scheduled and manual runs get their own groups, so that a pull request never cancels a nightly or a manual run.
  # Keyed on the pull request's number, because the `closed` run of a merged pull request may carry the base branch as
  # its ref.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.event.schedule) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event.action == 'ready_for_review' && 'ready' || 'full' }}
  cancel-in-progress: true

# Runners: every job runs on GitHub's hosted runners, never on a self-hosted one (a public repository must not
# run code from pull requests on a machine of its own).
# Two lanes (#303, product owner decision, 2026-10-29): every push starts the Ubuntu lane (`static`, `checks` and
# `electron` on ubuntu-24.04, in parallel). A draft pull request stops there, so the pushes while it is worked on cost
# a few runner minutes each. On a pull request that is not a draft, the nightly and the manual run the platform lane
# follows: `checks` and `electron` on macos-14 and windows-2025, after the Ubuntu lane of the same run passed (a pull
# request) or finished (nightly, manual). Marking a draft ready for review runs only the platform lane: the Ubuntu
# lane already ran on that commit (merge.md asks for it green first). So every pull request is checked
# on all three systems before its merge (merge.md), but not every push.

jobs:
  # Static checks: they do not depend on the operating system and need no build, so Ubuntu only and apart from the
  # tests (#303). Each step after the install runs even when an earlier one failed (`!cancelled()`), so that one red
  # step never hides another result; the job is red if any step is.
  static:
    name: static
    # A normal run takes 2-3 minutes; the bound ends a hang early.
    timeout-minutes: 8
    if: ${{ !contains(fromJSON('["closed","ready_for_review"]'), github.event.action) }}
    permissions:
      contents: read
      pull-requests: read # Write PR body
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its parents: the first parent is the base branch (size warning).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      # Large pull requests run long and are hard to review (#303): over 800 changed lines, the generated files of
      # .gitattributes not counted, the job shows a warning. It never fails the job. A moved file counts only its
      # changed lines.
      - name: Pull request size
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          lines="$(git diff --numstat -M HEAD^1 HEAD -- . ':(exclude)schemas/generated' \
            ':(exclude)packages/core/src/generated' ':(exclude)pnpm-lock.yaml' |
            awk '$1 != "-" { n += $1 + $2 } END { print n + 0 }')"
          echo "Changed lines without generated files: $lines" >> "$GITHUB_STEP_SUMMARY"
          if [ "$lines" -gt 800 ]; then
            echo "::warning title=Pull request size::$lines changed lines without generated files (over 800): split the pull request unless its change is inseparable (merge.md)."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check
      - name: Schemas
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm schemas:check
      - name: Generated contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm contracts:check
      - name: Licenses
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm licenses:check
      # scripts/sr-issues (Python, run by the spec-change skill); the label and reopen rules are unit-tested.
      # setup-python pins the version (it has builds for Ubuntu 24.04 on x64).
      - uses: actions/setup-python@v6
        id: python
        if: ${{ !cancelled() }}
        with:
          python-version: "3.14.8"
      - name: Python unit tests (scripts/sr-issues)
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 -m unittest discover -s scripts/sr-issues
      - name: Audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --prod --audit-level high
      # trace-check reads the ReqSeq workspace in spec/ with the `yaml` package (#326), and the PR text (D-050).
      - name: Write PR body
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        # The pull request as it is now, not as the event saw it: a label added right after opening the pull
        # request (`enabler`) counts in the run of `opened` too, and a re-run reads the current text (#571).
        run: |
          curl -fsS --retry 3 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$PR_URL" > pr.json
          jq -r '.title + "\n\n" + (.body // "")' pr.json > pr-body.txt
          jq -r '[.labels[].name] | any(. == "enabler" or . == "spec-export")' pr.json > pr-enabler.txt
      - name: Trace check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          args=""
          if [ "$IS_PR" = "true" ]; then
            # A pull request is always checked with its text: without it (`Write PR body` failed) the check fails.
            [ -f pr-body.txt ] && [ -f pr-enabler.txt ] || { echo "No PR body (see Write PR body)"; exit 1; }
            args="--pr-body pr-body.txt"
            if [ "$(cat pr-enabler.txt)" = "true" ]; then args="$args --enabler"; fi
          fi
          node scripts/trace-check/trace-check.mjs $args --report trace-report.md
      - name: Trace report
        if: always()
        run: cat trace-report.md >> "$GITHUB_STEP_SUMMARY" || true

  # Build, unit tests with coverage (ADR-0016), the spec check and the CLI e2e suite (ADR-0011), on Ubuntu in the
  # Ubuntu lane. `checks-platform` runs the same steps on macOS and Windows.
  # SR-076: Windows 11, macOS 14 and Ubuntu 24.04 are the reference systems.
  checks:
    name: checks (ubuntu-24.04)
    # A normal run takes 6-7 minutes; the bound ends a hang early.
    timeout-minutes: 15
    if: ${{ !contains(fromJSON('["closed","ready_for_review"]'), github.event.action) }}
    runs-on: ubuntu-24.04
    steps: &checks-steps
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its parents: the first parent is the base branch (changed files).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Pull requests that change only files no test or build reads (docs, agent rules, verification records,
      # Markdown at the root; .github/scripts/tests-needed.sh) skip the build, the unit tests, the spec check and
      # e2e, and Electron skips its tests, to save runner time (#520). Nightly and manual runs always run
      # everything. If this step fails, `tests` stays empty and everything runs (and the job is red).
      - name: Changed files
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # --no-renames: a file moved from packages/ to docs/ lists both paths.
          files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          # The base branch's copy of the classifier decides, not the pull request's own.
          tests="$(bash <(git show HEAD^1:.github/scripts/tests-needed.sh) <<< "$files")"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          {
            echo "Build, tests, spec check, e2e and Electron needed: \`$tests\` for $(printf '%s\n' "$files" | grep -c .) changed files:"
            echo '```'
            printf '%s\n' "$files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.tests != 'false' }}
        run: pnpm build
      # Coverage and its thresholds (ADR-0016) are measured on Linux and macOS. On Windows the unit tests run without
      # coverage (#304): tests of symbolic links, special files and execute bits are skipped there, so the per-file
      # 100 % cannot be reached on that system.
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ${{ runner.os != 'Windows' && 'pnpm test:coverage' || 'pnpm test' }}
      # The spec is a ReqSeq workspace (D-064, #326): ReqSeq checks it like any other (exit 1 on errors).
      - name: Check the spec with ReqSeq
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm spec:check

      # ADR-0011: CLI end-to-end tests spawn the built `reqseq` on fixture workspaces (packages/cli/test/e2e/),
      # including the local API and the MCP server.
      - name: CLI e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os != 'Linux' }}
        run: pnpm test:e2e
      # On Linux the suite runs inside a user and network namespace (`unshare -rn`): no network at all.
      - name: CLI e2e without network (unshare -rn)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          # Ubuntu 24.04 lets AppArmor block unprivileged user namespaces; allow them for this job only.
          # If unshare still fails, the step fails: the offline run is never skipped silently.
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Only loopback inside the namespace, and up, so API tests on 127.0.0.1 work there too (#125).
          unshare -rn sh -c 'ip link set lo up && exec ./node_modules/.bin/vitest run --config vitest.e2e.config.ts'

      # ADR-0017: the user documentation site is generated and built on every pull request that needs the tests,
      # Linux only. The site (Astro, Starlight) has its own lockfile outside the workspace; only these steps and
      # docs-pages.yml install it. The build runs without network, so Pagefind and Astro must not download anything,
      # and the links validator fails it on a dead internal link.
      - name: Docs - generate the content
        id: docs-generate
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: pnpm docs:generate
      - name: Docs - install the site
        id: docs-install
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: pnpm docs:install
      # `pnpm audit --prod` above sees only the workspace; the site's dev packages are audited here.
      - name: Docs - audit the site's dependencies
        if: ${{ !cancelled() && steps.docs-install.outcome == 'success' }}
        run: pnpm audit --dir packages/docs/site --ignore-workspace --audit-level high
      - name: Docs - build the site without network (unshare -rn)
        if: ${{ !cancelled() && steps.docs-generate.outcome == 'success' && steps.docs-install.outcome == 'success' }}
        run: |
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rn node packages/docs/site/run.mjs build

      # Evidence (D-050): the unit tests' and the e2e suite's JUnit files, as separate artifacts as before.
      - name: Upload JUnit results of the unit tests (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os || 'ubuntu-24.04' }}
          path: |
            test-results/
            !test-results/junit-e2e.xml
          if-no-files-found: ignore
      - name: Upload JUnit results of the e2e suite (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e-${{ matrix.os || 'ubuntu-24.04' }}
          path: test-results/junit-e2e.xml
          if-no-files-found: ignore

  # ADR-0010, ADR-0011: the Electron tests (packages/app/test/) start the built app with Playwright
  # (`_electron.launch`): it shows the status of a fixture workspace, an invoke gives what the CLI gives
  # (SR-080), the session cancels every request that is not local (SR-078), the renderer is sandboxed.
  # On Linux under xvfb with Chromium's sandbox on (no --no-sandbox; the runner user is not root).
  # In parallel to `checks`: it is the longest job, so on Ubuntu it runs in two shards on two runners (#303), each
  # with one app at a time (two workers on one runner made apps fail to start under load). `electron (ubuntu-24.04)`
  # below is green when both shards are. `electron-platform` runs the same steps on macOS and Windows in one job.
  electron-shard:
    name: electron (ubuntu-24.04, ${{ matrix.shard }}/2)
    # A normal run takes 5-6 minutes (install, build, half of about 260 tests one app at a time); the bound ends a hang.
    timeout-minutes: 15
    if: ${{ !contains(fromJSON('["closed","ready_for_review"]'), github.event.action) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    steps: &electron-steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      # As in `checks` (#520): a pull request that changes only docs skips the rest of this job within seconds
      # (the job then shows as passed, its steps as skipped). If this step fails, the job is red.
      - name: Changed files
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          tests="$(git diff --name-only --no-renames HEAD^1 HEAD | bash <(git show HEAD^1:.github/scripts/tests-needed.sh))"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Electron tests needed: \`$tests\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.tests != 'false'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.tests != 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.tests != 'false'
        run: pnpm install --frozen-lockfile
      # The Electron binary (about 100 MB) is downloaded once per version and system, not on every run (#303):
      # @electron/get keeps its downloads in `electron_config_cache`.
      - name: Electron version
        id: electron
        if: steps.changes.outputs.tests != 'false'
        shell: bash
        run: |
          version="$(node -p "require('./packages/app/node_modules/electron/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "electron_config_cache=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: electron-cache
        if: steps.changes.outputs.tests != 'false'
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
      # Saved right after the download, so that a red test run still fills the cache.
      - name: Electron binary
        if: steps.changes.outputs.tests != 'false'
        run: pnpm --filter @reqseq/app electron:install
      - uses: actions/cache/save@v4
        # One shard saves; both would try the same key.
        if: steps.changes.outputs.tests != 'false' && steps.electron-cache.outputs.cache-hit != 'true' && matrix.shard != 2
        with:
          path: ${{ runner.temp }}/electron-cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}
      # Core (the app loads it in its core process) and the CLI (the tests compare with it).
      - if: steps.changes.outputs.tests != 'false'
        run: pnpm build
      - name: Display server and libraries for Electron (Linux)
        if: runner.os == 'Linux' && steps.changes.outputs.tests != 'false'
        run: |
          # GitHub's image has most of these; install whatever is missing.
          packages="xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libcups2t64 libatk-bridge2.0-0t64 libxkbcommon0 libdrm2"
          if ! dpkg -s $packages >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $packages
          fi
          # Chromium's sandbox needs unprivileged user namespaces, which AppArmor blocks on Ubuntu 24.04.
          # If they are still blocked, the app does not start and the step after fails: never skipped silently.
          if ! unshare -r true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # `test:electron` downloads the Electron binary unless it is cached (pnpm runs no install scripts), builds the
      # app with electron-vite and runs Playwright.
      - name: Electron tests (xvfb)
        if: runner.os == 'Linux' && steps.changes.outputs.tests != 'false'
        # Each shard runs every second file (test/playwright.config.ts); without a shard, all of them.
        env:
          ELECTRON_SHARD: ${{ matrix.shard && format('{0}/2', matrix.shard) || '' }}
        run: xvfb-run -a pnpm --filter @reqseq/app test:electron
      - name: Electron tests
        if: runner.os != 'Linux' && steps.changes.outputs.tests != 'false'
        run: pnpm --filter @reqseq/app test:electron
      - name: Upload JUnit results (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-electron-${{ matrix.os || 'ubuntu-24.04' }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: |
            test-results/junit-electron.xml
            test-results/electron/
          if-no-files-found: ignore

  # The one Ubuntu Electron result that the platform lane and merge.md read: green when both shards are.
  electron:
    name: electron (ubuntu-24.04)
    needs: electron-shard
    timeout-minutes: 2
    if: ${{ !cancelled() && !contains(fromJSON('["closed","ready_for_review"]'), github.event.action) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Both shards passed
        env:
          RESULT: ${{ needs.electron-shard.result }}
        run: test "$RESULT" = success

  # The platform lane (#303): the steps of `checks` and `electron-shard` (unsharded) on macOS 14 and Windows 2025. A pull request runs
  # it only when it is not a draft, and only after its Ubuntu lane passed: a red Ubuntu lane starts no macOS or
  # Windows job. The run of `ready_for_review` has no Ubuntu lane and starts the platform lane at once. Nightly and manual runs run it after the Ubuntu lane whatever its result, so that every system's
  # result is there. A skipped platform job shows its name without the system (`checks (${{ matrix.os }})`), so
  # merge.md asks for the jobs of all three systems to be present and green.
  checks-platform:
    name: checks (${{ matrix.os }})
    needs: [static, checks, electron]
    # A normal run takes 7 (macOS) to 13 (Windows) minutes; the bound ends a hang.
    timeout-minutes: 25
    # The ready run has a concurrency group of its own, so a push after it does not cancel it; this job's own group
    # does (#303): a later run's platform job cancels the one still running on a superseded commit. The job name is
    # written out: `github.job` is empty when a job's concurrency is evaluated.
    concurrency:
      group: ci-platform-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-checks-${{ matrix.os }}
      cancel-in-progress: true
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.action == 'ready_for_review' ||
      (github.event.action != 'closed' &&
      !github.event.pull_request.draft && needs.static.result == 'success' &&
      needs.checks.result == 'success' && needs.electron.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps: *checks-steps

  electron-platform:
    name: electron (${{ matrix.os }})
    needs: [static, checks, electron]
    # Windows took more than 20 minutes on 2026-10-29 (one app at a time); the bound ends a hang.
    timeout-minutes: 30
    # The ready run has a concurrency group of its own, so a push after it does not cancel it; this job's own group
    # does (#303): a later run's platform job cancels the one still running on a superseded commit. The job name is
    # written out: `github.job` is empty when a job's concurrency is evaluated.
    concurrency:
      group: ci-platform-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-electron-${{ matrix.os }}
      cancel-in-progress: true
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.action == 'ready_for_review' ||
      (github.event.action != 'closed' &&
      !github.event.pull_request.draft && needs.static.result == 'success' &&
      needs.checks.result == 'success' && needs.electron.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps: *electron-steps

  # The cross-access consistency test (SR-080, packages/cli/test/cross-access.test.ts) runs in `checks` on all
  # three systems, the app's IPC included (its bridge and core side, without Electron); the e2e suite also runs
  # `reqseq serve api` and `reqseq mcp` as processes (servers.test.ts).
  # The performance suite with 50,000 elements runs apart, nightly and on PRs labelled `perf`: perf.yml.
