name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  # macOS runs only here, to save Actions minutes (product owner decision, 2026-10-24). No scheduled run on GitHub's runners
  # (product owner decision, 2026-10-26, #365: no Actions budget): Windows and the reference run on GitHub's runners only run
  # on manual dispatch before a stage acceptance, after the product owner has raised the spending limit.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      github-runners:
        description: Run Linux and macOS on GitHub's runners (costs Actions minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Label and text edits get their own group so they never cancel a full run.
  # Scheduled and manual runs get their own groups, so that a push to main never cancels a nightly run that waits
  # for the Mac, or a manual run on GitHub's runners.
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.event.schedule) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'meta' || 'full' }}
  cancel-in-progress: true

jobs:
  trace-check:
    name: trace-check
    if: ${{ !cancelled() }}
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '{"ubuntu-24.04":"ubuntu-24.04","macos-14":"macos-14","windows-2025":"windows-2025"}' || '{"ubuntu-24.04":["self-hosted","logreq-linux"],"macos-14":["self-hosted","logreq-mac"],"windows-2025":"windows-2025"}'))['ubuntu-24.04'] }}
    steps:
      - uses: actions/checkout@v4
      # trace-check reads the LogReq workspace in spec/ with the `yaml` package (#326).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > pr-body.txt
      - name: Trace check
        env:
          IS_ENABLER: ${{ contains(github.event.pull_request.labels.*.name, 'enabler') || contains(github.event.pull_request.labels.*.name, 'spec-export') }}
        run: |
          args=""
          if [ -f pr-body.txt ]; then args="--pr-body pr-body.txt"; fi
          if [ "$IS_ENABLER" = "true" ]; then args="$args --enabler"; fi
          node scripts/trace-check/trace-check.mjs $args --report trace-report.md
      - name: Report
        if: always()
        run: cat trace-report.md >> "$GITHUB_STEP_SUMMARY" || true

  # Self-hosted runners on the product owner's Mac (toolchain/self-hosted-runner/README.md), to save Actions minutes
  # (Thomas, 2026-10-25): Linux and macOS jobs always run there. While the Mac is offline they wait in the
  # queue instead of falling back to GitHub, so the Actions budget is never spent by accident (Thomas,
  # 2026-10-25: "pausieren oder so arbeiten, dass wir nicht wieder die Limits sprengen"). A manual run with
  # `github-runners: true` uses GitHub's runners for Linux and macOS when Thomas wants that.
  # Pull requests from forks never run there. Windows always runs on GitHub. The reference run on GitHub's
  # runners (macOS 14 and Ubuntu 24.04 x64 for SR-076) is a manual run with `github-runners: true` before a
  # stage acceptance; the weekly schedule for it was dropped with #365 (no Actions budget).
  # This job runs on the Mac too (#365: the spending limit was reached on 2026-10-26 and GitHub refused to start
  # it); only pull requests from forks use a GitHub runner for it. If it fails, the jobs that need it still
  # run (`!cancelled()`) and fall back to the Mac runners (the literal map in their `runs-on`, #251),
  # except for pull requests from forks, which never run on the Mac.
  # Windows has no self-hosted runner and stays red while GitHub cannot start hosted jobs.
  runners:
    name: pick runners
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted","logreq-linux"]') }}
    outputs:
      map: ${{ steps.pick.outputs.map }}
      # `false` only for a pull request whose files no heavy job reads (#520); empty means run.
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      - name: Pick runners
        id: pick
        shell: bash
        env:
          # Fine-grained token for this repository only, permission "Administration: read". It only
          # tells the summary whether the Mac is online; jobs go to the Mac either way.
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          REFERENCE_RUN: ${{ github.event.schedule == '0 4 * * 0' }}
          GITHUB_RUNNERS: ${{ github.event_name == 'workflow_dispatch' && inputs.github-runners }}
        run: |
          linux='["self-hosted","logreq-linux"]'
          macos='["self-hosted","logreq-mac"]'
          if [ "$SAME_REPO" != "true" ] || [ "$REFERENCE_RUN" = "true" ] || [ "$GITHUB_RUNNERS" = "true" ]; then
            linux='"ubuntu-24.04"'
            macos='"macos-14"'
          fi
          online="unknown"
          if [ -n "$GH_TOKEN" ] && [ "$SAME_REPO" = "true" ]; then
            online="$(curl -fsS --max-time 10 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" |
              jq -r '[.runners[] | select(.status == "online") | .labels[].name] | unique | join(" ")')" || online="unknown"
          fi
          echo "Online runner labels: \`${online:-none}\` (jobs for an offline Mac wait in the queue)" >> "$GITHUB_STEP_SUMMARY"
          map="{\"ubuntu-24.04\":$linux,\"macos-14\":$macos,\"windows-2025\":\"windows-2025\"}"
          echo "map=$map" >> "$GITHUB_OUTPUT"
          echo "Runners: \`$map\`" >> "$GITHUB_STEP_SUMMARY"
      # Pull requests that change only files no test or build reads (docs, agent rules, verification records,
      # Markdown at the root; .github/scripts/tests-needed.sh) skip `test`, `e2e` and `electron`, to spare the
      # three Linux runners (#520). The skipped jobs show as `skipped`. `trace-check` and `static` always run.
      # Pushes to main, nightly and manual runs always run everything. In this job, after `pick`, so it needs
      # no runner of its own; if it fails, `tests` stays empty and the heavy jobs run.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)
        with:
          # The merge commit and its parents: the first parent is the base branch it was merged into.
          fetch-depth: 2
          persist-credentials: false
      - name: Changed files
        id: changes
        if: github.event_name == 'pull_request' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)
        shell: bash
        run: |
          # --no-renames: a file moved from packages/ to docs/ lists both paths.
          files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          tests="$(.github/scripts/tests-needed.sh <<< "$files")"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          {
            echo "Heavy jobs (test, e2e, electron) needed: \`$tests\` for $(printf '%s\n' "$files" | grep -c .) changed files:"
            echo '```'
            printf '%s\n' "$files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Static checks run once; they do not depend on the operating system.
  static:
    name: static (typecheck, lint, format, contracts, licenses)
    # Title, body and label edits only matter to trace-check.
    if: ${{ !cancelled() && github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '{"ubuntu-24.04":"ubuntu-24.04","macos-14":"macos-14","windows-2025":"windows-2025"}' || '{"ubuntu-24.04":["self-hosted","logreq-linux"],"macos-14":["self-hosted","logreq-mac"],"windows-2025":"windows-2025"}'))['ubuntu-24.04'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm schemas:check
      - run: pnpm contracts:check
      - run: pnpm licenses:check
      # scripts/sr-issues (Python, run by the sr-issues skill); the label and reopen rules are unit-tested.
      # setup-python, because the self-hosted Linux image had no Python before python3 was added to it; the
      # version is pinned and has builds for Ubuntu 24.04 on x64 (GitHub) and arm64 (the Mac's Linux runners).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
      - run: python3 -m unittest discover -s scripts/sr-issues
      - run: pnpm audit --prod --audit-level high

  # SR-076: Windows 11, macOS 14 and Ubuntu 24.04 are the reference systems (macOS nightly).
  test:
    name: test (${{ matrix.os }})
    if: ${{ !cancelled() && github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && needs.runners.outputs.tests != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only on the nightly and manual runs; pull requests and pushes to main use Linux only.
        # Windows minutes cost money (product owner decision, 2026-10-26: Windows only at night); a nightly Windows failure is fixed
        # the next morning, and a manual run covers all three systems before a stage acceptance.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","macos-14","windows-2025"]' || github.event_name == 'schedule' && '["ubuntu-24.04","macos-14"]' || '["ubuntu-24.04"]') }}
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '{"ubuntu-24.04":"ubuntu-24.04","macos-14":"macos-14","windows-2025":"windows-2025"}' || '{"ubuntu-24.04":["self-hosted","logreq-linux"],"macos-14":["self-hosted","logreq-mac"],"windows-2025":"windows-2025"}'))[matrix.os] }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
      # The spec is a LogReq workspace (D-064, #326): LogReq checks it like any other (exit 1 on errors).
      # After the unit tests and also when they failed, so that a broken spec never hides a test result.
      - name: Check the spec with LogReq
        if: ${{ !cancelled() }}
        run: pnpm spec:check
      - name: Upload JUnit results (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # ADR-0011: CLI end-to-end tests spawn the built `logreq` on fixture workspaces (packages/cli/test/e2e/),
  # including the local API and the MCP server.
  # On Linux the suite runs inside a user and network namespace (`unshare -rn`): no network at all.
  e2e:
    name: e2e (${{ matrix.os }})
    if: ${{ !cancelled() && github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && needs.runners.outputs.tests != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only on the nightly and manual runs; pull requests and pushes to main use Linux only.
        # Windows minutes cost money (product owner decision, 2026-10-26: Windows only at night); a nightly Windows failure is fixed
        # the next morning, and a manual run covers all three systems before a stage acceptance.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","macos-14","windows-2025"]' || github.event_name == 'schedule' && '["ubuntu-24.04","macos-14"]' || '["ubuntu-24.04"]') }}
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '{"ubuntu-24.04":"ubuntu-24.04","macos-14":"macos-14","windows-2025":"windows-2025"}' || '{"ubuntu-24.04":["self-hosted","logreq-linux"],"macos-14":["self-hosted","logreq-mac"],"windows-2025":"windows-2025"}'))[matrix.os] }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: CLI e2e
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: CLI e2e without network (unshare -rn)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 lets AppArmor block unprivileged user namespaces; allow them for this job only.
          # If unshare still fails, the step fails: the offline run is never skipped silently.
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Only loopback inside the namespace, and up, so API tests on 127.0.0.1 work there too (#125).
          unshare -rn sh -c 'ip link set lo up && exec ./node_modules/.bin/vitest run --config vitest.e2e.config.ts'
      - name: Upload JUnit results (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e-${{ matrix.os }}
          path: test-results/junit-e2e.xml
          if-no-files-found: ignore

  # ADR-0010, ADR-0011: the Electron tests (packages/app/test/) start the built app with Playwright
  # (`_electron.launch`): it shows the status of a fixture workspace, an invoke gives what the CLI gives
  # (SR-080), the session cancels every request that is not local (SR-078), the renderer is sandboxed.
  # On Linux under xvfb with Chromium's sandbox on (no --no-sandbox; the runner user is not root).
  electron:
    name: electron (${{ matrix.os }})
    # A normal run takes a few minutes (install, build, about 20 s of tests); this only ends a hang.
    timeout-minutes: 20
    if: ${{ !cancelled() && github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && needs.runners.outputs.tests != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only on the nightly and manual runs; pull requests and pushes to main use Linux only.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","macos-14","windows-2025"]' || github.event_name == 'schedule' && '["ubuntu-24.04","macos-14"]' || '["ubuntu-24.04"]') }}
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '{"ubuntu-24.04":"ubuntu-24.04","macos-14":"macos-14","windows-2025":"windows-2025"}' || '{"ubuntu-24.04":["self-hosted","logreq-linux"],"macos-14":["self-hosted","logreq-mac"],"windows-2025":"windows-2025"}'))[matrix.os] }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Core (the app loads it in its core process) and the CLI (the tests compare with it).
      - run: pnpm build
      - name: Display server and libraries for Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          # The image of the self-hosted runners has no X libraries; GitHub's image has most of them.
          packages="xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libcups2t64 libatk-bridge2.0-0t64 libxkbcommon0 libdrm2"
          if ! dpkg -s $packages >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $packages
          fi
          # Chromium's sandbox needs unprivileged user namespaces, which AppArmor blocks on Ubuntu 24.04.
          # If they are still blocked, the app does not start and the step after fails: never skipped silently.
          if ! unshare -r true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # `test:electron` downloads the Electron binary (pnpm runs no install scripts), builds the app with
      # electron-vite and runs Playwright.
      - name: Electron tests (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @logreq/app test:electron
      - name: Electron tests
        if: runner.os != 'Linux'
        run: pnpm --filter @logreq/app test:electron
      - name: Upload JUnit results (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-electron-${{ matrix.os }}
          path: |
            test-results/junit-electron.xml
            test-results/electron/
          if-no-files-found: ignore

  # The cross-access consistency test (SR-080, packages/cli/test/cross-access.test.ts) runs in `test` on all
  # three systems, the app's IPC included (its bridge and core side, without Electron); `e2e` also runs
  # `logreq serve api` and `logreq mcp` as processes (servers.test.ts).
  # The performance suite with 50,000 elements runs apart, nightly and on PRs labelled `perf`: perf.yml.
