name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  # macOS runs only here, to save Actions minutes (Thomas, 2026-10-24).
  schedule:
    - cron: "0 2 * * *"
    # Weekly reference run on GitHub's runners only (job `runners`).
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Label and text edits get their own group so they never cancel a full run.
  group: ci-${{ github.ref }}-${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'meta' || 'full' }}
  cancel-in-progress: true

jobs:
  trace-check:
    name: trace-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > pr-body.txt
      - name: Trace check
        env:
          IS_ENABLER: ${{ contains(github.event.pull_request.labels.*.name, 'enabler') || contains(github.event.pull_request.labels.*.name, 'spec-export') }}
        run: |
          args=""
          if [ -f pr-body.txt ]; then args="--pr-body pr-body.txt"; fi
          if [ "$IS_ENABLER" = "true" ]; then args="$args --enabler"; fi
          node scripts/trace-check/trace-check.mjs $args --report trace-report.md
      - name: Report
        if: always()
        run: cat trace-report.md >> "$GITHUB_STEP_SUMMARY" || true

  # Self-hosted runners on the product owner's Mac (toolchain/self-hosted-runner/README.md), to save Actions minutes
  # (Thomas, 2026-10-25): Linux and macOS jobs run there while its runners are online, otherwise on GitHub.
  # Pull requests from forks never run there. Windows always runs on GitHub. The weekly reference run
  # (Sunday 04:00 UTC) uses GitHub's runners only, so that SR-076's macOS 14 and Ubuntu 24.04 (x64) stay covered.
  runners:
    name: pick runners
    if: github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    outputs:
      map: ${{ steps.pick.outputs.map }}
    steps:
      - name: Pick runners
        id: pick
        env:
          # Fine-grained token for this repository only, permission "Administration: read". Without it
          # (or when the API call fails) every job runs on GitHub.
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          REFERENCE_RUN: ${{ github.event.schedule == '0 4 * * 0' }}
        run: |
          linux='"ubuntu-24.04"'
          macos='"macos-14"'
          online=""
          if [ -n "$GH_TOKEN" ] && [ "$SAME_REPO" = "true" ] && [ "$REFERENCE_RUN" != "true" ]; then
            online="$(curl -fsS --max-time 10 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" |
              jq -r '[.runners[] | select(.status == "online") | .labels[].name] | unique | join(" ")')" || online=""
          fi
          case " $online " in *" logreq-linux "*) linux='["self-hosted","logreq-linux"]' ;; esac
          case " $online " in *" logreq-mac "*) macos='["self-hosted","logreq-mac"]' ;; esac
          map="{\"ubuntu-24.04\":$linux,\"macos-14\":$macos,\"windows-2025\":\"windows-2025\"}"
          echo "map=$map" >> "$GITHUB_OUTPUT"
          echo "Runners: \`$map\`" >> "$GITHUB_STEP_SUMMARY"

  # Static checks run once; they do not depend on the operating system.
  static:
    name: static (typecheck, lint, format, contracts, licenses)
    # Title, body and label edits only matter to trace-check.
    if: github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map)['ubuntu-24.04'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm schemas:check
      - run: pnpm contracts:check
      - run: pnpm licenses:check
      - run: pnpm audit --prod --audit-level high

  # SR-076: Windows 11, macOS 14 and Ubuntu 24.04 are the reference systems (macOS nightly).
  test:
    name: test (${{ matrix.os }})
    if: github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    strategy:
      fail-fast: false
      matrix:
        # macOS only on the nightly and manual runs; pull requests and main use Linux and Windows.
        os: ${{ fromJSON(contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && '["ubuntu-24.04","macos-14","windows-2025"]' || '["ubuntu-24.04","windows-2025"]') }}
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map)[matrix.os] }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
      - name: Upload JUnit results (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # ADR-0011: CLI end-to-end tests spawn the built `logreq` on fixture workspaces (packages/cli/test/e2e/),
  # including the local API and the MCP server.
  # On Linux the suite runs inside a user and network namespace (`unshare -rn`): no network at all.
  e2e:
    name: e2e (${{ matrix.os }})
    if: github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    strategy:
      fail-fast: false
      matrix:
        # macOS only on the nightly and manual runs; pull requests and main use Linux and Windows.
        os: ${{ fromJSON(contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && '["ubuntu-24.04","macos-14","windows-2025"]' || '["ubuntu-24.04","windows-2025"]') }}
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map)[matrix.os] }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: CLI e2e
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: CLI e2e without network (unshare -rn)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 lets AppArmor block unprivileged user namespaces; allow them for this job only.
          # If unshare still fails, the step fails: the offline run is never skipped silently.
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Only loopback inside the namespace, and up, so API tests on 127.0.0.1 work there too (#125).
          unshare -rn sh -c 'ip link set lo up && exec ./node_modules/.bin/vitest run --config vitest.e2e.config.ts'
      - name: Upload JUnit results (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e-${{ matrix.os }}
          path: test-results/junit-e2e.xml
          if-no-files-found: ignore

  # The cross-access consistency test (SR-080, packages/cli/test/cross-access.test.ts) runs in `test` on all
  # three systems; `e2e` also runs `logreq serve api` and `logreq mcp` as processes (servers.test.ts).
  # Added with the stage that needs it (ADR-0011): Electron/Playwright under xvfb (stage 3).
  # The performance suite with 50,000 elements runs apart, nightly and on PRs labelled `perf`: perf.yml.
