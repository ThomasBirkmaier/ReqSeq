name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Label and text edits get their own group so they never cancel a full run.
  group: ci-${{ github.ref }}-${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'meta' || 'full' }}
  cancel-in-progress: true

jobs:
  trace-check:
    name: trace-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > pr-body.txt
      - name: Trace check
        env:
          IS_ENABLER: ${{ contains(github.event.pull_request.labels.*.name, 'enabler') || contains(github.event.pull_request.labels.*.name, 'spec-export') }}
        run: |
          args=""
          if [ -f pr-body.txt ]; then args="--pr-body pr-body.txt"; fi
          if [ "$IS_ENABLER" = "true" ]; then args="$args --enabler"; fi
          node scripts/trace-check/trace-check.mjs $args --report trace-report.md
      - name: Report
        if: always()
        run: cat trace-report.md >> "$GITHUB_STEP_SUMMARY" || true

  # Static checks run once; they do not depend on the operating system.
  static:
    name: static (typecheck, lint, format, contracts, licenses)
    # Title, body and label edits only matter to trace-check.
    if: github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm schemas:check
      - run: pnpm contracts:check
      - run: pnpm licenses:check
      - run: pnpm audit --prod --audit-level high

  # SR-076: Windows 11, macOS 14 and Ubuntu 24.04 are the reference systems.
  test:
    name: test (${{ matrix.os }})
    if: github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
      - name: Upload JUnit results (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # ADR-0011: CLI end-to-end tests spawn the built `logreq` on fixture workspaces (packages/cli/test/e2e/),
  # including the local API and the MCP server.
  # On Linux the suite runs inside a user and network namespace (`unshare -rn`): no network at all.
  e2e:
    name: e2e (${{ matrix.os }})
    if: github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: CLI e2e
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: CLI e2e without network (unshare -rn)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 lets AppArmor block unprivileged user namespaces; allow them for this job only.
          # If unshare still fails, the step fails: the offline run is never skipped silently.
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Only loopback inside the namespace, and up, so API tests on 127.0.0.1 work there too (#125).
          unshare -rn sh -c 'ip link set lo up && exec ./node_modules/.bin/vitest run --config vitest.e2e.config.ts'
      - name: Upload JUnit results (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e-${{ matrix.os }}
          path: test-results/junit-e2e.xml
          if-no-files-found: ignore

  # The cross-access consistency test (SR-080, packages/cli/test/cross-access.test.ts) runs in `test` on all
  # three systems; `e2e` also runs `logreq serve api` and `logreq mcp` as processes (servers.test.ts).
  # Added with the stage that needs them (ADR-0011): Electron/Playwright under xvfb (stage 3),
  # nightly performance with 50,000 elements (stage 1).
