name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed]
  # No run on a push to main (product owner decision, 2026-10-28): every pull request is fully checked before its merge,
  # and with three runners the main runs only queued up and were cancelled by the next merge. The nightly run and the
  # manual run check main; a red nightly run is fixed on main the next morning.
  # macOS runs only here, to save Actions minutes (product owner decision, 2026-10-24). No scheduled run on GitHub's runners
  # (product owner decision, 2026-10-26, #365: no Actions budget): Windows and the reference run on GitHub's runners only run
  # on manual dispatch before a stage acceptance, after the product owner has raised the spending limit.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      github-runners:
        description: Run Linux and macOS on GitHub's runners (costs Actions minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Label and text edits get their own group so they never cancel a full run. A label other than `enabler` or
  # `spec-export` does not change trace-check's result: its run starts no job and gets a group of its own, so that
  # it never cancels a running text check (#566). A change of the base branch is a full run: the code is checked
  # against the new base.
  # Closing or merging a pull request joins the full group and so cancels its queued or running full run; the
  # run of `closed` starts no job (product owner decision, 2026-10-28: no runner time for pull requests that are done).
  # Scheduled and manual runs get their own groups, so that a pull request never cancels a nightly run that waits
  # for the Mac, or a manual run on GitHub's runners.
  # Keyed on the pull request's number, because the `closed` run of a merged pull request may carry the base branch as
  # its ref.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.event.schedule) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && !contains(fromJSON('["enabler","spec-export"]'), github.event.label.name) && format('noop-{0}', github.run_id) || github.event.action == 'edited' && github.event.changes.base && 'full' || contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'meta' || 'full' }}
  cancel-in-progress: true

# Runners (toolchain/self-hosted-runner/README.md): Linux and macOS jobs run on the self-hosted runners on the
# product owner's Mac, to save Actions minutes (product owner decision, 2026-10-25); while the Mac is offline they wait in the queue instead of
# falling back to GitHub, so the Actions budget is never spent by accident. Each job's `runs-on` is a fixed
# expression, so no job has to pick the runners first (#566: that job waited 3-13 min for a runner of its own):
# - pull requests from forks never run on the Mac: GitHub's runners;
# - a manual run with `github-runners: true` (the reference run for SR-076 before a stage acceptance: macOS 14 and
#   Ubuntu 24.04 x64) uses GitHub's runners for Linux and macOS;
# - Windows always runs on GitHub (no self-hosted runner); it stays red while GitHub cannot start hosted jobs.
# The expression is repeated in each job because `runs-on` cannot read workflow-level `env`.

jobs:
  # Title, body and label edits only matter to trace-check, which reads the PR text (D-050). The full run's
  # `checks` job runs the same check; this job runs only for edits of the title or body (not of the base branch)
  # and for the labels that trace-check reads, in a concurrency group of its own.
  pr-text:
    name: trace-check (PR text)
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.state == 'open' &&
      ((github.event.action == 'edited' && !github.event.changes.base) ||
      (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
      contains(fromJSON('["enabler","spec-export"]'), github.event.label.name)))
    permissions:
      contents: read
      pull-requests: read # Write PR body
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-24.04"' || '["self-hosted","logreq-linux"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      # No pnpm cache: the root's devDependencies (about 160 packages; trace-check needs `yaml`, #326) download
      # faster than the whole store's cache restores.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install the root's dependencies only
        run: pnpm install --frozen-lockfile --filter logreq --ignore-scripts
      - name: Write PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        # The pull request as it is now, not as the event saw it: a label added right after opening the pull
        # request (`enabler`) counts in the run of `opened` too, and a re-run reads the current text (#571).
        run: |
          curl -fsS --retry 3 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$PR_URL" > pr.json
          jq -r '.title + "\n\n" + (.body // "")' pr.json > pr-body.txt
          jq -r '[.labels[].name] | any(. == "enabler" or . == "spec-export")' pr.json > pr-enabler.txt
      - name: Trace check
        run: |
          args="--pr-body pr-body.txt"
          if [ "$(cat pr-enabler.txt)" = "true" ]; then args="$args --enabler"; fi
          node scripts/trace-check/trace-check.mjs $args --report trace-report.md
      - name: Report
        if: always()
        run: cat trace-report.md >> "$GITHUB_STEP_SUMMARY" || true

  # One job for every check but Electron (#566): one checkout, one install, one build. On Linux it runs, in this
  # order, the static checks (they do not depend on the operating system, so Linux only), the build, the unit tests
  # with coverage, the spec check, the CLI e2e suite without network and trace-check. Each step after the install
  # runs even when an earlier check failed (`!cancelled()`), so that one red step never hides another result; the
  # job is red if any step is.
  # SR-076: Windows 11, macOS 14 and Ubuntu 24.04 are the reference systems (macOS nightly).
  checks:
    name: checks (${{ matrix.os }})
    # A normal run takes 6-7 minutes; this only ends a hang, so that it does not hold a Linux runner for 6 hours.
    timeout-minutes: 30
    if: ${{ !contains(fromJSON('["edited","labeled","unlabeled","closed"]'), github.event.action) || (github.event.action == 'edited' && github.event.changes.base) }}
    permissions:
      contents: read
      pull-requests: read # Write PR body
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only on the nightly and manual runs; pull requests use Linux only.
        # Windows minutes cost money (product owner decision, 2026-10-26: Windows only at night); a nightly Windows failure is fixed
        # the next morning, and a manual run covers all three systems before a stage acceptance.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","macos-14","windows-2025"]' || github.event_name == 'schedule' && '["ubuntu-24.04","macos-14"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'workflow_dispatch' && inputs.github-runners)) && '{"ubuntu-24.04":"ubuntu-24.04","macos-14":"macos-14","windows-2025":"windows-2025"}' || '{"ubuntu-24.04":["self-hosted","logreq-linux"],"macos-14":["self-hosted","logreq-mac"],"windows-2025":"windows-2025"}')[matrix.os] }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its parents: the first parent is the base branch (changed files).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Pull requests that change only files no test or build reads (docs, agent rules, verification records,
      # Markdown at the root; .github/scripts/tests-needed.sh) skip the build, the unit tests, the spec check and
      # e2e, and Electron skips its tests, to spare the three Linux runners (#520). The static checks and
      # trace-check always run. Nightly and manual runs always run everything. If this step
      # fails, `tests` stays empty and everything runs (and the job is red).
      - name: Changed files
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # --no-renames: a file moved from packages/ to docs/ lists both paths.
          files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          # The base branch's copy of the classifier decides, not the pull request's own.
          tests="$(bash <(git show HEAD^1:.github/scripts/tests-needed.sh) <<< "$files")"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          {
            echo "Build, tests, spec check, e2e and Electron needed: \`$tests\` for $(printf '%s\n' "$files" | grep -c .) changed files:"
            echo '```'
            printf '%s\n' "$files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Static checks, once (Linux).
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' }}
        run: pnpm lint
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' }}
        run: pnpm format:check
      - name: Schemas
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' }}
        run: pnpm schemas:check
      - name: Generated contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' }}
        run: pnpm contracts:check
      - name: Licenses
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' }}
        run: pnpm licenses:check
      # scripts/sr-issues (Python, run by the spec-change skill); the label and reopen rules are unit-tested.
      # setup-python, because the self-hosted Linux image had no Python before python3 was added to it; the
      # version is pinned and has builds for Ubuntu 24.04 on x64 (GitHub) and arm64 (the Mac's Linux runners).
      - uses: actions/setup-python@v6
        id: python
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' }}
        with:
          python-version: "3.14.8"
      - name: Python unit tests (scripts/sr-issues)
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 -m unittest discover -s scripts/sr-issues
      - name: Audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' }}
        run: pnpm audit --prod --audit-level high

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.tests != 'false' }}
        run: pnpm build
      - name: Unit tests with coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:coverage
      # The spec is a LogReq workspace (D-064, #326): LogReq checks it like any other (exit 1 on errors).
      - name: Check the spec with LogReq
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm spec:check

      # ADR-0011: CLI end-to-end tests spawn the built `logreq` on fixture workspaces (packages/cli/test/e2e/),
      # including the local API and the MCP server.
      - name: CLI e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os != 'Linux' }}
        run: pnpm test:e2e
      # On Linux the suite runs inside a user and network namespace (`unshare -rn`): no network at all.
      - name: CLI e2e without network (unshare -rn)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          # Ubuntu 24.04 lets AppArmor block unprivileged user namespaces; allow them for this job only.
          # If unshare still fails, the step fails: the offline run is never skipped silently.
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Only loopback inside the namespace, and up, so API tests on 127.0.0.1 work there too (#125).
          unshare -rn sh -c 'ip link set lo up && exec ./node_modules/.bin/vitest run --config vitest.e2e.config.ts'

      # trace-check reads the LogReq workspace in spec/ with the `yaml` package (#326), and the PR text (D-050).
      - name: Write PR body
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        # The pull request as it is now, not as the event saw it: a label added right after opening the pull
        # request (`enabler`) counts in the run of `opened` too, and a re-run reads the current text (#571).
        run: |
          curl -fsS --retry 3 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$PR_URL" > pr.json
          jq -r '.title + "\n\n" + (.body // "")' pr.json > pr-body.txt
          jq -r '[.labels[].name] | any(. == "enabler" or . == "spec-export")' pr.json > pr-enabler.txt
      - name: Trace check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-24.04' }}
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          args=""
          if [ "$IS_PR" = "true" ]; then
            # A pull request is always checked with its text: without it (`Write PR body` failed) the check fails.
            [ -f pr-body.txt ] && [ -f pr-enabler.txt ] || { echo "No PR body (see Write PR body)"; exit 1; }
            args="--pr-body pr-body.txt"
            if [ "$(cat pr-enabler.txt)" = "true" ]; then args="$args --enabler"; fi
          fi
          node scripts/trace-check/trace-check.mjs $args --report trace-report.md
      - name: Trace report
        if: ${{ always() && matrix.os == 'ubuntu-24.04' }}
        run: cat trace-report.md >> "$GITHUB_STEP_SUMMARY" || true

      # Evidence (D-050): the unit tests' and the e2e suite's JUnit files, as separate artifacts as before.
      - name: Upload JUnit results of the unit tests (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: |
            test-results/
            !test-results/junit-e2e.xml
          if-no-files-found: ignore
      - name: Upload JUnit results of the e2e suite (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e-${{ matrix.os }}
          path: test-results/junit-e2e.xml
          if-no-files-found: ignore

  # ADR-0010, ADR-0011: the Electron tests (packages/app/test/) start the built app with Playwright
  # (`_electron.launch`): it shows the status of a fixture workspace, an invoke gives what the CLI gives
  # (SR-080), the session cancels every request that is not local (SR-078), the renderer is sandboxed.
  # On Linux under xvfb with Chromium's sandbox on (no --no-sandbox; the runner user is not root).
  # In parallel to `checks`: it is the longest job.
  electron:
    name: electron (${{ matrix.os }})
    # A normal run takes a few minutes (install, build, about 20 s of tests); this only ends a hang.
    timeout-minutes: 20
    if: ${{ !contains(fromJSON('["edited","labeled","unlabeled","closed"]'), github.event.action) || (github.event.action == 'edited' && github.event.changes.base) }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only on the nightly and manual runs; pull requests use Linux only.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","macos-14","windows-2025"]' || github.event_name == 'schedule' && '["ubuntu-24.04","macos-14"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'workflow_dispatch' && inputs.github-runners)) && '{"ubuntu-24.04":"ubuntu-24.04","macos-14":"macos-14","windows-2025":"windows-2025"}' || '{"ubuntu-24.04":["self-hosted","logreq-linux"],"macos-14":["self-hosted","logreq-mac"],"windows-2025":"windows-2025"}')[matrix.os] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      # As in `checks` (#520): a pull request that changes only docs skips the rest of this job within seconds
      # (the job then shows as passed, its steps as skipped). If this step fails, the job is red.
      - name: Changed files
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          tests="$(git diff --name-only --no-renames HEAD^1 HEAD | bash <(git show HEAD^1:.github/scripts/tests-needed.sh))"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Electron tests needed: \`$tests\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.tests != 'false'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.tests != 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.tests != 'false'
        run: pnpm install --frozen-lockfile
      # Core (the app loads it in its core process) and the CLI (the tests compare with it).
      - if: steps.changes.outputs.tests != 'false'
        run: pnpm build
      - name: Display server and libraries for Electron (Linux)
        if: runner.os == 'Linux' && steps.changes.outputs.tests != 'false'
        run: |
          # The image of the self-hosted runners has no X libraries; GitHub's image has most of them.
          packages="xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libcups2t64 libatk-bridge2.0-0t64 libxkbcommon0 libdrm2"
          if ! dpkg -s $packages >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $packages
          fi
          # Chromium's sandbox needs unprivileged user namespaces, which AppArmor blocks on Ubuntu 24.04.
          # If they are still blocked, the app does not start and the step after fails: never skipped silently.
          if ! unshare -r true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # `test:electron` downloads the Electron binary (pnpm runs no install scripts), builds the app with
      # electron-vite and runs Playwright.
      - name: Electron tests (xvfb)
        if: runner.os == 'Linux' && steps.changes.outputs.tests != 'false'
        run: xvfb-run -a pnpm --filter @logreq/app test:electron
      - name: Electron tests
        if: runner.os != 'Linux' && steps.changes.outputs.tests != 'false'
        run: pnpm --filter @logreq/app test:electron
      - name: Upload JUnit results (evidence, D-050)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-electron-${{ matrix.os }}
          path: |
            test-results/junit-electron.xml
            test-results/electron/
          if-no-files-found: ignore

  # The cross-access consistency test (SR-080, packages/cli/test/cross-access.test.ts) runs in `checks` on all
  # three systems, the app's IPC included (its bridge and core side, without Electron); the e2e suite also runs
  # `logreq serve api` and `logreq mcp` as processes (servers.test.ts).
  # The performance suite with 50,000 elements runs apart, nightly and on PRs labelled `perf`: perf.yml.
