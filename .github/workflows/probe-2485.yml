# Temporary probe for #2485, removed before the pull request is ready.
name: Probe 2485
on:
  push:
    branches: [claude/project-thread-om8z8w-2485]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Boot and Defender before anything
        run: |
          (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime().ToString('o')
          Get-MpComputerStatus | Select-Object AMRunningMode,RealTimeProtectionEnabled,OnAccessProtectionEnabled | Format-List
          Get-MpPreference | Select-Object DisableRealtimeMonitoring,ExclusionPath | Format-List
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Toolchain
        working-directory: packages/shell
        run: |
          rustup toolchain install
          echo "CARGO_INCREMENTAL=0" >> "$env:GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$env:GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: shell-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/shell/Cargo.lock', 'packages/shell/rust-toolchain.toml') }}-llvm-cov-0.9.1-audit-0.22.2
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shell/target
          key: shell-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/shell/Cargo.lock', 'packages/shell/Cargo.toml', 'packages/shell/*/Cargo.toml', 'packages/shell/rust-toolchain.toml') }}-llvm-cov-0.9.1
          restore-keys: shell-target-v1-${{ runner.os }}-${{ runner.arch }}-
      - working-directory: packages/shell
        run: cargo fetch --locked
      - run: pnpm --filter @reqseq/shell build:e2e
      - name: Probe
        run: node .github/probe-2485/probe.mjs
