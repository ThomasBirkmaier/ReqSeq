name: Probe 2497

# Temporary probe for #2497: runs only packages/cli/test/perf/start.test.ts on Windows. Delete with its branch.

on:
  push:
    branches: [probe/2497-perf-start-windows]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm vitest run --config vitest.perf.config.ts packages/cli/test/perf/start.test.ts
