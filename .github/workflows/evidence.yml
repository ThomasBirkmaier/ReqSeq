# Evidence of the own spec (#946): the JUnit files of a run on main become the evidence records that ReqSeq reads from
# spec/evidence/ (spec/reqseq-workspace.yaml), the way toolchain/junit/README.md tells a user to connect a test tool.
# Three sources, each a kind with files of its own (#998): `ci` (ci.yml, nightly or manual), `perf` (perf.yml, nightly
# or manual: the performance suite) and `delivery` (release.yml, a release tag or a manual run: the delivery tests).
# A run of one kind replaces only the files of its kind and leaves the others as they are on main. Product owner decision, 2026-11-05: the evidence lives in this repository, written by CI and
# brought onto main through a pull request that merges itself; local runs are no source.
#
# - `enrich` (read rights only) checks out the tested commit, builds the CLI and runs `reqseq evidence enrich-junit`
#   on each JUnit file of the run, against the spec of that commit (D-026). One date for the whole run (its start), so
#   that the records of one run tie and a failure in any file of it wins over a pass in another (ThomasBirkmaier/ReqSeq-archive#525 Q2).
# - `publish` runs no code of the repository: it copies the enriched files onto a branch cut from the current main,
#   with a GitHub App token, so that the pull request gets the normal CI run that the required checks read (a pull
#   request made with GITHUB_TOKEN starts none).
#
# Each suite and system keeps one file with a fixed name that the next run of its kind replaces; Git history keeps the
# older runs, each named by its commit in `reqseq:item` (D-008).

name: Evidence

on:
  workflow_run:
    workflows: [CI, Performance, Release]
    types: [completed]
    # A release tag runs Release with the tag as its branch.
    branches: [main, "v*"]
  workflow_dispatch:
    inputs:
      workflow:
        description: Workflow whose newest completed run on main to record, when no run is given. Never skipped.
        type: choice
        options: [CI, Performance, Release]
        default: CI
      run-id:
        description: Run of CI, Performance or Release on main or a release tag to record (empty = the newest of the workflow above).
        required: false

permissions: {}

concurrency:
  # One at a time per source, none cancelled: each run closes the evidence pull requests of its kind it supersedes.
  # Per source, because a group keeps only one pending run and would drop the other sources' runs of the night.
  group: evidence-${{ github.event.workflow_run.name || inputs.workflow }}
  cancel-in-progress: false

jobs:
  enrich:
    name: enrich
    # Only runs that check main as a whole (nightly, manual, a release tag), never a pull request's run. The step
    # `The run` checks the same in full, also for a manual start.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped' &&
      ((github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event)) ||
      (github.event.workflow_run.name == 'Release' && github.event.workflow_run.event == 'push')))
    permissions:
      actions: read # The run and its artifacts
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.files.outputs.publish }}
      sha: ${{ steps.run.outputs.sha }}
      run: ${{ steps.run.outputs.id }}
      kind: ${{ steps.run.outputs.kind }}
      workflow: ${{ steps.run.outputs.workflow }}
    steps:
      - name: The run
        id: run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_RUN: ${{ inputs.run-id }}
          INPUT_WORKFLOW: ${{ inputs.workflow }}
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            // The kind of each source, by its workflow file.
            const kinds = { ".github/workflows/ci.yml": "ci", ".github/workflows/perf.yml": "perf", ".github/workflows/release.yml": "delivery" };
            const files = { CI: "ci.yml", Performance: "perf.yml", Release: "release.yml" };
            const qualifies = (r) => r.head_repository?.full_name === `${owner}/${repo}` && r.status === "completed"
              && !["cancelled", "skipped"].includes(r.conclusion) && kinds[r.path] !== undefined
              && ((r.head_branch === "main" && ["schedule", "workflow_dispatch"].includes(r.event))
                || (kinds[r.path] === "delivery" && r.event === "push" && /^v/.test(r.head_branch ?? "")));
            let run;
            if (context.eventName === "workflow_run") {
              run = context.payload.workflow_run;
            } else if (process.env.INPUT_RUN) {
              run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(process.env.INPUT_RUN) })).data;
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: files[process.env.INPUT_WORKFLOW || "CI"], status: "completed", per_page: 50,
              });
              run = runs.data.workflow_runs.find(qualifies);
            }
            if (!run) core.setFailed("No completed nightly, manual or release-tag run on main.");
            if (run && !qualifies(run)) core.setFailed(`Run ${run.id} is no completed nightly, manual or release-tag run on main.`);
            core.setOutput("id", String(run?.id ?? ""));
            core.setOutput("sha", run?.head_sha ?? "");
            core.setOutput("date", run?.run_started_at ?? "");
            core.setOutput("conclusion", run?.conclusion ?? "");
            core.setOutput("kind", kinds[run?.path] ?? "");
            core.setOutput("workflow", run?.name ?? "");

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
          fetch-depth: 0 # The skip below compares with the commit of the last evidence on main.
          persist-credentials: false

      # Nothing but evidence changed since the commit the evidence of this kind on main was taken from: the run would
      # record the same code again. A manual start always records.
      - name: Anything new since the last evidence
        id: skip
        shell: bash
        env:
          SHA: ${{ steps.run.outputs.sha }}
          KIND: ${{ steps.run.outputs.kind }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git fetch --quiet origin main
          # A release tag may point anywhere (a throwaway tag to try release.yml); only a commit of main is evidence.
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::notice::$SHA is not a commit of main; nothing recorded."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$KIND" in
            ci) files=("spec/evidence/ci/unit-*" "spec/evidence/ci/e2e-*" "spec/evidence/ci/electron-*") ;;
            *) files=("spec/evidence/ci/$KIND-*") ;;
          esac
          # -a: .gitattributes marks the files -diff, which git grep would treat as binary.
          last="$(git grep -a -h -o -E 'main@[0-9a-f]{40}' origin/main -- "${files[@]}" 2>/dev/null | head -n 1 | cut -d@ -f2 || true)"
          [[ "$last" =~ ^[0-9a-f]{40}$ ]] || last=""
          skip=false
          if [ "$MANUAL" != true ] && [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null &&
            git diff --quiet "$last" "$SHA" -- . ':(exclude)spec/evidence'; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Last $KIND evidence on main: \`${last:-none}\`, this run: \`$SHA\`, skipped: $skip" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.skip.outputs.skip == 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.skip.outputs.skip == 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build the CLI
        if: steps.skip.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile && pnpm --filter "@reqseq/cli..." build

      # ci: one artifact per suite and system (ci.yml): junit-<os>/junit.xml, junit-e2e-<os>/junit-e2e.xml,
      # junit-electron-<os>[-<shard>]/junit-electron.xml (the Electron artifacts also hold screenshots, never read).
      # perf: perf-results/test-results/junit-perf.xml and junit-perf-electron.xml (perf.yml, Ubuntu only).
      # delivery: junit-delivery-<os>/junit-delivery.xml (release.yml).
      - name: JUnit files of the run
        if: steps.skip.outputs.skip == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          pattern: ${{ steps.run.outputs.kind == 'perf' && 'perf-results' || 'junit-*' }}
          path: ${{ runner.temp }}/junit

      - name: Enrich
        id: files
        if: steps.skip.outputs.skip == 'false'
        shell: bash
        env:
          SHA: ${{ steps.run.outputs.sha }}
          DATE: ${{ steps.run.outputs.date }}
          RUN: ${{ steps.run.outputs.id }}
          KIND: ${{ steps.run.outputs.kind }}
          WORKFLOW: ${{ steps.run.outputs.workflow }}
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          JUNIT: ${{ runner.temp }}/junit
        run: |
          # The files of this run go to $new (published); spec/evidence/ci holds main's files of every kind with this
          # run's on top, so that the check and the degree below read what main will hold.
          out=spec/evidence/ci
          new="$RUNNER_TEMP/out/ci"
          rm -rf "$out" && mkdir -p "$out" "$new"
          git checkout origin/main -- "$out" 2>/dev/null || true
          status=0
          {
            echo "$WORKFLOW run $RUN on \`$SHA\` ($CONCLUSION), started $DATE."
            echo
            echo "| File | Enriched test cases | Without a requirement | Unknown |"
            echo "|---|---|---|---|"
          } > "$RUNNER_TEMP/summary.md"
          # The artifacts a full run of the kind uploads. The workflows upload with `if-no-files-found: ignore`, so
          # a suite that wrote no file has no artifact at all; it is listed, and main keeps its last file.
          case "$KIND" in
            ci) expected="junit-ubuntu-24.04 junit-macos-26 junit-windows-2025 junit-e2e-ubuntu-24.04 junit-e2e-macos-26
              junit-e2e-windows-2025 junit-electron-ubuntu-24.04-1 junit-electron-ubuntu-24.04-2 junit-electron-macos-26-1
              junit-electron-macos-26-2 junit-electron-windows-2025-1 junit-electron-windows-2025-2" ;;
            perf) expected="perf-results" ;;
            delivery) expected="junit-delivery-macos-26 junit-delivery-ubuntu-24.04 junit-delivery-windows-2025" ;;
          esac
          for artifact in $expected; do
            [ -d "$JUNIT/$artifact" ] || echo "| \`$artifact\` | no artifact | | |" >> "$RUNNER_TEMP/summary.md"
          done
          # One line per file: artifact, file, name of the evidence file, system.
          for dir in "$JUNIT"/*/; do
            artifact="$(basename "$dir")"
            case "$KIND:$artifact" in
              ci:junit-e2e-*) echo "$artifact $dir/junit-e2e.xml e2e-${artifact#junit-e2e-} ${artifact#junit-e2e-}" ;;
              ci:junit-electron-*) os="${artifact#junit-electron-}"; echo "$artifact $dir/junit-electron.xml electron-$os ${os%-[0-9]}" ;;
              ci:junit-delivery-*) ;;
              ci:junit-*) echo "$artifact $dir/junit.xml unit-${artifact#junit-} ${artifact#junit-}" ;;
              perf:perf-results)
                echo "$artifact $dir/test-results/junit-perf.xml perf-ubuntu-24.04 ubuntu-24.04"
                echo "$artifact $dir/test-results/junit-perf-electron.xml perf-electron-ubuntu-24.04 ubuntu-24.04" ;;
              delivery:junit-delivery-*) echo "$artifact $dir/junit-delivery.xml delivery-${artifact#junit-delivery-} ${artifact#junit-delivery-}" ;;
            esac
          done > "$RUNNER_TEMP/files.txt"
          while read -r artifact file name os; do
            if [ ! -f "$file" ]; then
              echo "| \`$artifact\` | missing $(basename "$file") | | |" >> "$RUNNER_TEMP/summary.md"
              continue
            fi
            set +e
            node packages/cli/dist/bin.js evidence enrich-junit "$file" "main@$SHA ($os)" --date "$DATE" \
              --workspace spec --output "$new/$name.xml" --json > "$RUNNER_TEMP/$name.json"
            code=$?
            set -e
            [ "$code" -eq 0 ] || status=1
            node -e '
              const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              const unknown = (r.unknown ?? []).length;
              console.log(`| \`${process.argv[2]}.xml\` | ${r.testCases ?? "?"} | ${r.withoutReference ?? "?"} | ${unknown} |`);
            ' "$RUNNER_TEMP/$name.json" "$name" >> "$RUNNER_TEMP/summary.md" || echo "| \`$name.xml\` | error $code | | |" >> "$RUNNER_TEMP/summary.md"
          done < "$RUNNER_TEMP/files.txt"
          if compgen -G "$new/*.xml" > /dev/null; then cp "$new"/*.xml "$out/"; fi
          # A suite split into shards (macOS Electron, #1229): its shard files replace the one file of before.
          for file in "$new"/*-1.xml; do [ -e "$file" ] && rm -f "$out/$(basename "${file%-1.xml}").xml"; done
          # The records as ReqSeq reads them: the workspace check reads every evidence file (codes evidence.*).
          node packages/cli/dist/bin.js workspace check --workspace spec > "$RUNNER_TEMP/check.txt" || status=1
          {
            echo
            echo "Verification degree of the system requirements (core):"
            echo '```'
            node packages/cli/dist/bin.js evidence degree --workspace spec --where-type system-requirement || true
            echo '```'
          } >> "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/out/"
          if compgen -G "$new/*.xml" > /dev/null; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
          # An unknown requirement (a typo in a test name) or a finding of the check fails the job after the files
          # are written, so the other results are still published.
          exit "$status"

      - name: Keep the enriched files for publish
        if: ${{ !cancelled() && steps.files.outputs.publish == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ steps.run.outputs.id }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

  publish:
    name: publish
    needs: enrich
    # A manual start runs the workflow file of the branch it names; only main's may use the App key.
    if: ${{ !cancelled() && needs.enrich.outputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read # The artifact of `enrich`
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: App token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.EVIDENCE_APP_ID }}
          private-key: ${{ secrets.EVIDENCE_APP_KEY }}
          # Only what the job needs, not every permission of the installation.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}

      - name: Enriched files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-${{ needs.enrich.outputs.run }}
          path: ${{ runner.temp }}/evidence

      - name: Pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          SHA: ${{ needs.enrich.outputs.sha }}
          RUN: ${{ needs.enrich.outputs.run }}
          KIND: ${{ needs.enrich.outputs.kind }}
          WORKFLOW: ${{ needs.enrich.outputs.workflow }}
          SOURCE: ${{ runner.temp }}/evidence
        run: |
          # Over main's files: the other kinds, and a suite without an artifact in this run, keep their last file.
          mkdir -p spec/evidence/ci
          cp "$SOURCE"/ci/*.xml spec/evidence/ci/
          # A suite split into shards (macOS Electron, #1229): its shard files replace the one file of before.
          for file in "$SOURCE"/ci/*-1.xml; do
            old="spec/evidence/ci/$(basename "${file%-1.xml}").xml"
            if [ -e "$file" ] && [ -e "$old" ]; then git rm -q "$old"; fi
          done
          if git diff --quiet && [ -z "$(git status --porcelain spec/evidence)" ]; then
            echo "Nothing changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          repo="$GITHUB_REPOSITORY"
          # Older evidence pull requests of the same kind edit the same files; this one replaces them. Those of
          # another kind edit other files and stay.
          bot="$APP_SLUG[bot]"
          for n in $(gh api "repos/$repo/pulls?state=open&per_page=100" --jq ".[] | select(.head.repo.full_name == \"$repo\" and .user.login == \"$bot\" and (.head.ref | startswith(\"evidence/$KIND-\"))) | .number"); do
            gh api -X PATCH "repos/$repo/pulls/$n" -f state=closed > /dev/null
            gh api -X POST "repos/$repo/issues/$n/comments" -f body="Replaced by the evidence of $WORKFLOW run $RUN." > /dev/null
          done
          branch="evidence/$KIND-run-$RUN"
          git config user.name "reqseq-evidence[bot]"
          git config user.email "reqseq-evidence[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add spec/evidence/ci
          git commit -q -m "chore(evidence): $KIND test results of main@${SHA:0:7}" -m "Enriched JUnit files of $WORKFLOW run $RUN on $SHA (evidence.yml)." -m "Refs #946"
          git push -q origin "$branch"
          {
            echo "## Summary"
            echo
            echo "Evidence of the own spec: the JUnit files of $WORKFLOW run [$RUN](https://github.com/$repo/actions/runs/$RUN) on \`$SHA\`, enriched with \`reqseq evidence enrich-junit\` (evidence.yml). Merges itself on green checks; agents leave it alone (CLAUDE.md)."
            echo
            echo "Refs #946"
            echo
            echo "## System requirements"
            echo
            echo "None (evidence of the own spec, #946)"
            echo
            echo "## Verification"
            echo
            cat "$SOURCE/summary.md"
          } > "$RUNNER_TEMP/body.md"
          number="$(gh api "repos/$repo/pulls" -f title="chore(evidence): $KIND evidence of main@${SHA:0:7}" -f head="$branch" -f base=main \
            -F body=@"$RUNNER_TEMP/body.md" --jq .number)"
          gh api -X POST "repos/$repo/issues/$number/labels" -f 'labels[]=task' -f 'labels[]=dev' > /dev/null
          gh pr merge "$number" --repo "$repo" --auto --squash
          echo "Pull request #$number" >> "$GITHUB_STEP_SUMMARY"
