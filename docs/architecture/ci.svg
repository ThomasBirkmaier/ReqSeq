.u { stroke: var(--u); } .m { stroke: var(--m); } .w { stroke: var(--w); } .o { stroke: var(--o); }
.lane.u { fill: var(--u); } .lane.m { fill: var(--m); } .lane.w { fill: var(--w); } .lane.o { fill: var(--o); }
.lh.u { fill: var(--u); } .lh.m { fill: var(--m); } .lh.w { fill: var(--w); } .lh.o { fill: var(--o); }
