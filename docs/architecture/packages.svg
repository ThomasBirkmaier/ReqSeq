<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="ReqSeq workspace packages">
<style>
svg { --bg: #ffffff; --fg: #18202b; --muted: #5a6575; --line: #c6ced9; --u: #c4521b; --m: #5d6c84; --w: #1c6db0; --o: #7a4fb0; --req: #0d8257; --req-fg: #ffffff; }
@media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --fg: #e2e7ee; --muted: #98a3b3; --line: #344050; --u: #ee7c45; --m: #a7b4c8; --w: #5ea8e8; --o: #b79cf0; --req: #3cc68e; --req-fg: #0c1a14; } }
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--fg); font-size: 10.5px; }
.bg { fill: var(--bg); }
.n { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
.h { font-size: 15px; font-weight: 600; }
.s { fill: var(--muted); }
.box { fill: var(--bg); stroke-width: 1.6; }
.trig { fill: var(--bg); stroke: var(--fg); stroke-width: 1.2; stroke-dasharray: 4 3; }
.lane { stroke: var(--line); stroke-width: 1; fill-opacity: 0.07; }
.lh { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
.u { stroke: var(--u); } .m { stroke: var(--m); } .w { stroke: var(--w); } .o { stroke: var(--o); }
.lane.u { fill: var(--u); } .lane.m { fill: var(--m); } .lane.w { fill: var(--w); } .lane.o { fill: var(--o); }
.lh.u { fill: var(--u); } .lh.m { fill: var(--m); } .lh.w { fill: var(--w); } .lh.o { fill: var(--o); }
.sep { stroke: var(--line); stroke-width: 1; }
.arr { fill: none; stroke: var(--fg); stroke-width: 1.3; }
.arr.dev { stroke-dasharray: 5 4; }
.ah { fill: var(--fg); }
.req { fill: var(--req); } .reqt { fill: var(--req-fg); font-size: 9.5px; font-weight: 700; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="600" height="740"/>
<text class="h" x="20" y="34">ReqSeq workspace packages and their dependencies</text>
<text class="s" x="20" y="52">Generated from packages/*/package.json by pnpm docs:diagrams. An arrow points to a dependency;</text>
<text class="s" x="20" y="66">dashed: devDependency only. Dependencies implied through another package have no arrow.</text>
<path class="arr" d="M153,404 L153,460" marker-end="url(#ah)"/>
<path class="arr" d="M144,260 L153,344" marker-end="url(#ah)"/>
<path class="arr" d="M162,260 L447,344" marker-end="url(#ah)"/>
<path class="arr dev" d="M153,604 L300,660" marker-end="url(#ah)"/>
<path class="arr" d="M300,144 L153,200" marker-end="url(#ah)"/>
<path class="arr" d="M447,404 L153,460" marker-end="url(#ah)"/>
<path class="arr dev" d="M447,520 L300,660" marker-end="url(#ah)"/>
<path class="arr dev" d="M447,288 L153,344" marker-end="url(#ah)"/>
<rect class="box w" x="20" y="344" width="266" height="60" rx="5"/><text class="n" x="30" y="363">@reqseq/api</text><text class="s" x="30" y="379">uses core, testkit (dev)</text><text class="s" x="30" y="393">external: none</text>
<rect class="box w" x="20" y="200" width="266" height="60" rx="5"/><text class="n" x="30" y="219">@reqseq/cli</text><text class="s" x="30" y="235">uses api, core, mcp, testkit (dev)</text><text class="s" x="30" y="249">external: commander, yaml</text>
<rect class="box w" x="20" y="460" width="266" height="144" rx="5"/><text class="n" x="30" y="479">@reqseq/core</text><text class="s" x="30" y="495">uses testkit (dev)</text><text class="s" x="30" y="509">external: ajv, ajv-formats,</text><text class="s" x="30" y="523">hast-util-to-mdast, katex,</text><text class="s" x="30" y="537">mdast-util-from-markdown,</text><text class="s" x="30" y="551">mdast-util-gfm, mdast-util-to-hast,</text><text class="s" x="30" y="565">mdast-util-to-markdown,</text><text class="s" x="30" y="579">micromark-extension-gfm, minisearch,</text><text class="s" x="30" y="593">yaml</text>
<rect class="box w" x="167" y="84" width="266" height="60" rx="5"/><text class="n" x="177" y="103">@reqseq/docs</text><text class="s" x="177" y="119">uses api, cli, core, mcp</text><text class="s" x="177" y="133">external: minisearch, yaml</text>
<rect class="box w" x="314" y="344" width="266" height="60" rx="5"/><text class="n" x="324" y="363">@reqseq/mcp</text><text class="s" x="324" y="379">uses core</text><text class="s" x="324" y="393">external: @modelcontextprotocol/server</text>
<rect class="box w" x="314" y="460" width="266" height="60" rx="5"/><text class="n" x="324" y="479">@reqseq/shell</text><text class="s" x="324" y="495">uses testkit (dev)</text><text class="s" x="324" y="509">external: none</text>
<rect class="box w" x="167" y="660" width="266" height="60" rx="5"/><text class="n" x="177" y="679">@reqseq/testkit</text><text class="s" x="177" y="695">uses no workspace package</text><text class="s" x="177" y="709">external: none</text>
<rect class="box w" x="314" y="200" width="266" height="88" rx="5"/><text class="n" x="324" y="219">@reqseq/web</text><text class="s" x="324" y="235">uses api (dev), core (dev), testkit (dev)</text><text class="s" x="324" y="249">external: @fontsource/ibm-plex-mono,</text><text class="s" x="324" y="263">@fontsource/ibm-plex-sans,</text><text class="s" x="324" y="277">@tauri-apps/api, katex</text>
</svg>
