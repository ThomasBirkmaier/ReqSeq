<path class="mcp wire" d="M302,443.0 C364.02691597225123,443.0 364.02691597225123,393.3927392611049 426.0538319445025,393.3927392611049"/>
<circle class="mcp cf" cx="302" cy="443.0" r="4"/>
<path class="cli wire" d="M898,173.0 C835.9730840277488,173.0 835.9730840277488,266.6072607388951 773.9461680554975,266.6072607388951"/>
<circle class="cli cf" cx="898" cy="173.0" r="4"/>
<path class="cli wire" d="M898,305.0 C835.9730840277488,305.0 835.9730840277488,266.6072607388951 773.9461680554975,266.6072607388951"/>
<circle class="cli cf" cx="898" cy="305.0" r="4"/>
