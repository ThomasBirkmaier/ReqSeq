<circle class="api cf" cx="898" cy="463.0" r="4"/>
<path d="M600,442 L600,498 M600,526 L600,548" style="stroke:var(--muted);stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round;fill:none"/>
<rect x="524" y="500" width="152" height="24" rx="12" style="fill:var(--bg)"/><text x="600" y="516" text-anchor="middle" class="s">reads and writes files</text>
<circle cx="600" cy="330" r="150" style="fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 6"/>
<circle class="shadow" cx="600" cy="340" r="108"/>
<circle cx="600" cy="330" r="110" fill="url(#hub)"/>
<circle cx="600" cy="330" r="110" style="fill:none;stroke:#ffffff;stroke-opacity:.25;stroke-width:1"/>
<text x="600" y="324" text-anchor="middle" style="font-size:34px;font-weight:700;fill:#fff;letter-spacing:-0.5px">ReqSeq</text>
<text x="600" y="350" text-anchor="middle" style="font-size:12.5px;fill:#fff;fill-opacity:.85">one core,</text>
<text x="600" y="366" text-anchor="middle" style="font-size:12.5px;fill:#fff;fill-opacity:.85">the same result everywhere</text>
<g class="app"><rect x="426.05383194450246" y="250.6072607388951" width="76" height="32" rx="16" class="cf"/><rect x="426.05383194450246" y="250.6072607388951" width="76" height="32" rx="16" style="fill:none;stroke:var(--bg);stroke-width:3"/><text x="464.05383194450246" y="271.6072607388951" text-anchor="middle" class="mono" style="font-size:14px;font-weight:700;fill:var(--bg)">App</text></g>
<g class="mcp"><rect x="426.0538319445025" y="377.3927392611049" width="76" height="32" rx="16" class="cf"/><rect x="426.0538319445025" y="377.3927392611049" width="76" height="32" rx="16" style="fill:none;stroke:var(--bg);stroke-width:3"/><text x="464.0538319445025" y="398.3927392611049" text-anchor="middle" class="mono" style="font-size:14px;font-weight:700;fill:var(--bg)">MCP</text></g>
<g class="cli"><rect x="697.9461680554975" y="250.6072607388951" width="76" height="32" rx="16" class="cf"/><rect x="697.9461680554975" y="250.6072607388951" width="76" height="32" rx="16" style="fill:none;stroke:var(--bg);stroke-width:3"/><text x="735.9461680554975" y="271.6072607388951" text-anchor="middle" class="mono" style="font-size:14px;font-weight:700;fill:var(--bg)">CLI</text></g>
<g class="api"><rect x="697.9461680554975" y="377.3927392611049" width="76" height="32" rx="16" class="cf"/><rect x="697.9461680554975" y="377.3927392611049" width="76" height="32" rx="16" style="fill:none;stroke:var(--bg);stroke-width:3"/><text x="735.9461680554975" y="398.3927392611049" text-anchor="middle" class="mono" style="font-size:14px;font-weight:700;fill:var(--bg)">API</text></g>
<g class="app"><rect class="shadow" x="44" y="178" width="254" height="86" rx="14"/><rect class="card" x="40" y="170" width="262" height="86" rx="14"/><circle class="tint" cx="80" cy="213.0" r="23"/><g transform="translate(68,201.0) scale(1.0)" class="ico cs"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></g><text class="t" x="116" y="200">You</text><text class="s" x="116" y="222">Read, edit and trace</text><text class="s" x="116" y="238">in the desktop app</text></g>
<g class="mcp"><rect class="shadow" x="44" y="408" width="254" height="86" rx="14"/><rect class="card" x="40" y="400" width="262" height="86" rx="14"/><circle class="tint" cx="80" cy="443.0" r="23"/><g transform="translate(68,431.0) scale(1.0)" class="ico cs"><circle cx="8" cy="8.5" r="3.4"/><path d="M2 20c0-3.6 2.7-6 6-6s6 2.4 6 6"/><path d="M18 3l1.1 3.9L23 8l-3.9 1.1L18 13l-1.1-3.9L13 8l3.9-1.1z"/></g><text class="t" x="116" y="430">You and an AI assistant</text><text class="s" x="116" y="452">Chat; the assistant calls</text><text class="s" x="116" y="468">ReqSeq tools over MCP</text></g>
<g class="cli"><rect class="shadow" x="902" y="138" width="254" height="86" rx="14"/><rect class="card" x="898" y="130" width="262" height="86" rx="14"/><circle class="tint" cx="938" cy="173.0" r="23"/><g transform="translate(926,161.0) scale(1.0)" class="ico cs"><rect x="4.5" y="8" width="15" height="11.5" rx="3.5"/><path d="M12 8V4.5"/><circle cx="12" cy="3.5" r="1"/><circle cx="9.3" cy="13.6" r="1.1"/><circle cx="14.7" cy="13.6" r="1.1"/><path d="M2 13v2.5M22 13v2.5"/></g><text class="t" x="974" y="160">Coding agent</text><text class="s" x="974" y="182">Changes the spec with</text><text class="s" x="974" y="198">commands in a shell</text></g>
<g class="cli"><rect class="shadow" x="902" y="270" width="254" height="86" rx="14"/><rect class="card" x="898" y="262" width="262" height="86" rx="14"/><circle class="tint" cx="938" cy="305.0" r="23"/><g transform="translate(926,293.0) scale(1.0)" class="ico cs"><circle cx="5" cy="6" r="2.4"/><circle cx="5" cy="18" r="2.4"/><path d="M5 8.4v7.2"/><path d="M5 12h6a4 4 0 0 0 4-4V6"/><path d="M13 16.5l2.5 2.5 5-5.5"/></g><text class="t" x="974" y="292">CI pipeline</text><text class="s" x="974" y="314">Checks every pull request,</text><text class="s" x="974" y="330">records test evidence</text></g>
<g class="api"><rect class="shadow" x="902" y="428" width="254" height="86" rx="14"/><rect class="card" x="898" y="420" width="262" height="86" rx="14"/><circle class="tint" cx="938" cy="463.0" r="23"/><g transform="translate(926,451.0) scale(1.0)" class="ico cs"><path d="M8.5 4.5c-2 0-3 1-3 3v2c0 1.4-.8 2.5-2 2.5 1.2 0 2 1.1 2 2.5v2c0 2 1 3 3 3"/><path d="M15.5 4.5c2 0 3 1 3 3v2c0 1.4.8 2.5 2 2.5-1.2 0-2 1.1-2 2.5v2c0 2-1 3-3 3"/><path d="M10 12h.01M14 12h.01"/></g><text class="t" x="974" y="450">Scripts and tools</text><text class="s" x="974" y="472">Call commands over HTTP</text><text class="s" x="974" y="488">on loopback</text></g>
<rect class="shadow" x="366" y="558" width="468" height="128" rx="16"/>
<rect class="card" x="360" y="548" width="480" height="128" rx="16"/>
<g style="--c:var(--fg)"><g transform="translate(384,570) scale(1.0833333333333333)" class="ico cs"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></g></g>
<text class="t" x="422" y="588"><tspan class="mono">spec/</tspan> in your Git repository</text>
<text class="s" x="384" y="616">One Markdown file per element, next to the code. ReqSeq reads</text>
<text class="s" x="384" y="632">the Git history and never commits.</text>
