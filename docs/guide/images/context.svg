<g class="api"><rect class="tint" x="718.8" y="644" width="96.0" height="22" rx="6"/><text class="mono ct" x="728.8" y="659" style="font-size:11.5px">baselines/</text></g>
<line x1="40" x2="1160" y1="690" y2="690" style="stroke:var(--line)"/>
<g style="--c:var(--muted)"><g transform="translate(40,704) scale(0.75)" class="ico cs"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></g></g><text class="s" x="66" y="718" style="font-size:12.5px">Offline: no network connections, no telemetry</text>
