<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="ReqSeq in the middle: you use the app, you and an AI assistant use MCP, coding agents and CI pipelines use the CLI, scripts use the API; ReqSeq keeps the spec as files in Git.">
<style>
svg { --bg:#ffffff; --card:#ffffff; --fg:#18202b; --muted:#5a6575; --line:#c6ced9; --soft:#f3f5f8;
  --app:#1c6db0; --mcp:#7a4fb0; --cli:#c4521b; --api:#0d8257; --hubA:#2f5fc4; --hubB:#7a4fb0; --shadow:#18202b; --sh:0.08; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --card:#151b24; --fg:#e2e7ee; --muted:#98a3b3; --line:#344050; --soft:#1a212c;
  --app:#5ea8e8; --mcp:#b79cf0; --cli:#ee7c45; --api:#3cc68e; --hubA:#3d6fd6; --hubB:#8a5cc8; --shadow:#000000; --sh:0.45; } }
text { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--fg); }
.mono { font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
.bg { fill: var(--bg); }
.card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
.muted { fill: var(--muted); }
.t { font-size: 15px; font-weight: 600; }
.s { font-size: 12px; fill: var(--muted); }
.ico { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.app { --c: var(--app); } .mcp { --c: var(--mcp); } .cli { --c: var(--cli); } .api { --c: var(--api); }
.cs { stroke: var(--c); } .cf { fill: var(--c); } .ct { fill: var(--c); }
.tint { fill: var(--c); fill-opacity: 0.12; }
.wire { fill: none; stroke: var(--c); stroke-width: 2; }
.shadow { fill: var(--shadow); opacity: var(--sh); filter: url(#blur); }
</style>
<defs>
<filter id="blur" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
<linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--hubA)"/><stop offset="1" stop-color="var(--hubB)"/></linearGradient>
</defs>
<rect class="bg" width="1200" height="760" rx="16"/>
<text x="40" y="52" style="font-size:22px;font-weight:700">Who works with ReqSeq, and how</text>
<text x="40" y="76" class="s" style="font-size:13.5px">Four ways in, one command catalog, one result. The spec stays plain files in your repository.</text>
<path class="app wire" d="M302,213.0 C364.02691597225123,213.0 364.02691597225123,266.6072607388951 426.05383194450246,266.6072607388951"/>
