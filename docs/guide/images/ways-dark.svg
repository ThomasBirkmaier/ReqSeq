<text x="600.0" y="212" text-anchor="middle" style="font-size:19px;font-weight:800">ReqSeq</text>
<text x="600.0" y="236" text-anchor="middle" class="s">the same commands with the same result, whichever way in</text>
<path d="M600.0,266 V302" stroke="#5b6577" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<path d="M595.0,295 L600.0,302 L605.0,295" stroke="#5b6577" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
