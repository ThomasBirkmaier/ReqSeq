<text x="614.0" y="288.0" class="e">reads and writes Markdown</text>
<rect x="330.0" y="306" width="540" height="96" rx="12" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.75" stroke-width="1.3"/>
<g transform="translate(344.0,319)" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5a1 1 0 0 1 1-1h4l2 2h6a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></g>
<text x="370.0" y="333" class="k" style="fill:#34d399">spec/ in your Git repository</text>
