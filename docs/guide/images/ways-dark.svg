text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f1f4f8}
.k{font-size:15px;font-weight:700;letter-spacing:.01em} .t{font-size:13.5px;font-weight:500}
.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#aab3c0} .s{font-size:12.5px;fill:#aab3c0} .e{font-size:12px;fill:#aab3c0;font-style:italic}
</style>
