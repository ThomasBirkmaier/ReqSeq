<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="ReqSeq keeps the chain from a need to the evidence of its tests. Your agent writes the need and the system requirement into ReqSeq through the CLI or MCP, and your code and tests into your repository; the test results come to ReqSeq as JUnit XML and are recorded as evidence against the version of the system requirement. Each element carries a version, and each relation keeps the version of its target.">
