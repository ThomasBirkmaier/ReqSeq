.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#111827} .v{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#4b5563} .s{font-size:12.5px;fill:#4b5563}
.e{font-size:12px;fill:#4b5563;font-style:italic}
</style>
