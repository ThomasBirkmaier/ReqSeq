# Test vectors for the version (Fassung), normal form n1 (ADR-0005, D-013, D-027, D-057, SR-091).
# Other tools can reimplement the version with them (N-048).
#
# For each vector:
#   element    element file (input), byte for byte; .gitattributes keeps line endings and trailing spaces.
#   files      images the text embeds that exist, as normalised paths relative to the element file's folder
#              (here: this folder, which is also the repository), each path once; their SHA-256 counts
#              (ADR-0005 "Files").
#   missing    images the text embeds that do not exist; they count with the marker `missing`.
#   canonical  the exact canonical bytes (UTF-8) of normal form n1.
#   version    "n1:" + the first 16 hex characters of SHA-256 over the canonical bytes.
# Text is everything after the line that closes the frontmatter. Frontmatter values are as parsed by the
# YAML 1.2 core schema. Which properties count comes from the property definitions of the element's type in
# `metamodel` (flag `content`).
# `pnpm schemas:check` checks element schema, files and hash; packages/core/src/version/vectors.test.ts
# recomputes canonical bytes and version from the element file.
metamodel: ../metamodel/standard-model.yaml
vectors:
  # CRLF line endings and non-ASCII text, no content properties, no files.
  - element: N-42cdd0f51ca7.md
    files: []
    missing: []
    canonical: N-42cdd0f51ca7.canonical.txt
    version: n1:4d6e3c81753d1f36
  # LF; trailing spaces and tabs, extra blank lines, an image, a validity target, an inline reference with the
  # real version of the N vector, and properties that do not count (title, status, packages, emergent,
  # verification method, relation kind, unknown key).
  - element: SR-825b7146fb54.md
    files: [SR-825b7146fb54/layout.png]
    missing: []
    canonical: SR-825b7146fb54.canonical.txt
    version: n1:e386ab40f7f71d31
  # Frontmatter LF, text CR only; trailing NBSP and form feed (kept), U+2028 inside a line, a tabs-only line,
  # a tab inside an acceptance criterion, a single (non-list) validity target, a verification method (does not count). Images: one outside the
  # element's folder and linked twice (once via ./ and ..), one percent-encoded, one reference-style and
  # missing; an absolute URL, a path outside the repository and a plain (non-image) link do not count.
  - element: SR-9f0a1b2c3d4e.md
    files: [SR-9f0a1b2c3d4e/arrow head.png, shared/compass.png]
    missing: [SR-9f0a1b2c3d4e/sketch.png]
    canonical: SR-9f0a1b2c3d4e.canonical.txt
    version: n1:eeca493b104dc3e0
  # The Markdown subset (ADR-0005 "Files"): an image in an HTML comment counts; a definition line inside a
  # paragraph is none, so its reference image does not count; a definition after a list item marker with
  # balanced parentheses, and one in a list item right after another item; a line indented by a tab after a
  # blank line is code; query and fragment dropped; an escape removed; invalid percent-encoding, a `\`, a
  # trailing dot and a trailing `/` are missing on every OS; a control character, the element's own file and
  # `.git` do not count.
  - element: SR-7a8b9c0d1e2f.md
    files:
      - SR-7a8b9c0d1e2f/comment.png
      - SR-7a8b9c0d1e2f/item.png
      - SR-7a8b9c0d1e2f/list(1).png
      - SR-7a8b9c0d1e2f/photo.png
      - SR-7a8b9c0d1e2f/under_score.png
    missing:
      - SR-7a8b9c0d1e2f/bad%zz.png
      - SR-7a8b9c0d1e2f\none.png
      - SR-7a8b9c0d1e2f/dot.
      - SR-7a8b9c0d1e2f/photo.png/
    canonical: SR-7a8b9c0d1e2f.canonical.txt
    version: n1:45959b807c3bfb7d
