# The desktop shell (ADR-0021): a Cargo workspace of its own, apart from the pnpm build. `shell` is the Tauri program
# `reqseq-shell`, `launcher` the Linux program `ReqSeq` that checks for the web engine first.
[workspace]
resolver = "3"
members = ["shell", "launcher"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
# A crash closes every handle at once, so the server's standard input ends and the server stops (ADR-0021, End).
panic = "abort"
